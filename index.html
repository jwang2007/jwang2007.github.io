<title>my house</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:
      repeating-linear-gradient(180deg, transparent 0 26px, rgba(110,150,220,.16) 26px 27px),
      #fcfcf9;
    font-family:"Comic Sans MS","Comic Neue","Segoe Print","Bradley Hand",cursive;

  #c{position:fixed;inset:0;display:block;touch-action:none}
  .panel{position:fixed;z-index:5;background:#fff;border:2.5px solid #141414;border-radius:10px;
         box-shadow:3px 3px 0 #141414;padding:7px 12px;color:#141414;line-height:1.45}
  #loc{top:12px;right:12px;font-size:14px}
  #toast{bottom:64px;left:50%;transform:translateX(-50%);font-size:15px;opacity:0;

  #stick{position:fixed;z-index:6;width:96px;height:96px;border:2.5px dashed #141414;border-radius:50%;
         display:none;pointer-events:none;background:rgba(255,255,255,.55)}
  #knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;
        border:2.5px solid #141414;border-radius:50%;background:#fff;box-shadow:2px 2px 0 #141414}
  #xh{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;
      pointer-events:none;z-index:4;opacity:.85}
  #xh::before,#xh::after{content:"";position:absolute;background:#141414}
  #xh::before{left:6px;top:0;width:2px;height:14px}
  #xh::after{left:0;top:6px;width:14px;height:2px}
  #aimtip{position:fixed;left:50%;top:calc(50% + 20px);transform:translateX(-50%);display:none;

  #mbtns{position:fixed;right:14px;bottom:24px;display:none;flex-direction:column;gap:12px;z-index:6}

          font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:2px 2px 0 #141414;

  .tag{border:2px solid #141414;border-radius:999px;padding:1px 9px;background:#fff}

             display:flex;flex-direction:column}
  .rframe{flex:1;min-height:0;border:2.5px solid #141414;border-radius:8px;overflow:auto;background:#fff}

  .cgh{margin:13px 0 6px;font-size:12.5px;letter-spacing:1.5px;opacity:.55;font-weight:700}
  .cgh:first-child{margin-top:0}
  .clist{list-style:none;margin:0;padding:0}
  .crow{display:block;width:100%;text-align:left;font-family:inherit;font-size:14px;background:#fff;

        margin-bottom:7px;cursor:pointer;color:#141414;line-height:1.3}

<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============ renderer / scene ============ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfcfcf9);     // the paper is part of the world now
scene.fog = new THREE.Fog(0xfcfcf9, 12, 58);      // far lines fade like light pencil
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 150);
camera.rotation.order = 'YXZ';

const INK = 0x141414;
function flatMat(c){ return new THREE.MeshBasicMaterial({color:c, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1}); }
const meshMat   = flatMat(0xffffff);
const yellowMat = flatMat(0xf3d95c);
const PAL = {                       // chunky-cartoon prop colors (the walls stay white)
  red:    flatMat(0xe0705a),
  teal:   flatMat(0x5fb3a1),
  blue:   flatMat(0x6f9ceb),
  green:  flatMat(0x8db862),
  purple: flatMat(0xa88fd8),
  pink:   flatMat(0xe89bb4),
  orange: flatMat(0xe8994d),
  wood:   flatMat(0xcf9d63),
  dark:   flatMat(0xa9784a),
  cork:   flatMat(0xd8b98a),
  cream:  flatMat(0xf5ead3)
};
const BOOK_MATS = [PAL.red, PAL.blue, PAL.green, yellowMat];
const lineMat = new THREE.LineBasicMaterial({color:INK});
const leafMat = new THREE.LineBasicMaterial({color:0x4c7a3d});

const aabbs = [];       // solid boxes: {x0,x1,z0,z1,y0,y1,land}
const segs  = [];       // solid wall segments: {ax,az,bx,bz,ht,y0,y1}
const occluders = [];   // every raycastable mesh

let seed = 7;
function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

/* white box + black outline (the whole world is made of these) */
function box(w,h,d,x,y,z,o){
  o = o || {};
  const g = new THREE.BoxGeometry(w,h,d);
  const m = new THREE.Mesh(g, o.mat || meshMat); m.position.set(x,y,z); scene.add(m);
  occluders.push(m);
  if (o.surface) m.userData.surface = true;
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), lineMat);
  e.position.set(x,y,z); scene.add(e);
  if (o.solid) aabbs.push({x0:x-w/2, x1:x+w/2, z0:z-d/2, z1:z+d/2, y0:y-h/2, y1:y+h/2, land:o.land !== false});
  return m;
}

/* mesh + outline as part of a group (for items, trophies, furniture) */
function part(g, geo, px, py, pz, rx, ry, rz, mat){
  const m = new THREE.Mesh(geo, mat || meshMat);
  m.position.set(px, py, pz); m.rotation.set(rx || 0, ry || 0, rz || 0);
  g.add(m);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat);
  e.position.copy(m.position); e.rotation.copy(m.rotation);
  g.add(e);
  return m;
}

/* many boxes merged into one fill mesh + one outline object (bookshelves etc.) */
function mergedBoxes(list, mat){
  const fArr = [], eArr = [];
  const m4 = new THREE.Matrix4(), eu = new THREE.Euler(), q = new THREE.Quaternion();
  const sc = new THREE.Vector3(1,1,1), tv = new THREE.Vector3();
  for (const b of list){
    const g = new THREE.BoxGeometry(b.w, b.h, b.d);
    eu.set(b.rx || 0, b.ry || 0, b.rz || 0); q.setFromEuler(eu); tv.set(b.x, b.y, b.z);
    m4.compose(tv, q, sc); g.applyMatrix4(m4);
    fArr.push(g.toNonIndexed().getAttribute('position').array);
    eArr.push(new THREE.EdgesGeometry(g).getAttribute('position').array);
  }
  function build(arrs){
    let n = 0; for (const a of arrs) n += a.length;
    const out = new Float32Array(n); let o = 0;
    for (const a of arrs){ out.set(a, o); o += a.length; }
    const bg = new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.BufferAttribute(out, 3));
    return bg;
  }
  return { fill: new THREE.Mesh(build(fArr), mat || meshMat),
           edge: new THREE.LineSegments(build(eArr), lineMat) };
}

/* a LineSegments object from flat [x,y,z] point pairs */
function linesFlat(pts, m){
  const a = new Float32Array(pts.length * 3);
  for (let i = 0; i < pts.length; i++){ a[i*3] = pts[i][0]; a[i*3+1] = pts[i][1]; a[i*3+2] = pts[i][2]; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(a, 3));
  return new THREE.LineSegments(g, m || lineMat);
}
function loopLine(pts, y){
  const v = pts.map(p => new THREE.Vector3(p[0], y, p[1]));
  scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(v), lineMat));
}

/* ============ walls with doorways ============ */
const T = 0.16, DOOR_W = 1.9, DOOR_H = 2.2;

function cut(s0, g0, g1){
  const out = [];
  for (const s of s0){
    if (g1 <= s[0] || g0 >= s[1]) { out.push(s); continue; }
    if (g0 > s[0]) out.push([s[0], g0]);
    if (g1 < s[1]) out.push([g1, s[1]]);
  }
  return out;
}
function wallX(z, a, b, doors, h){          // wall running along X at fixed z
  h = h || 3.2;
  let s0 = [[a, b]];
  for (const c of (doors || [])){
    s0 = cut(s0, c - DOOR_W/2, c + DOOR_W/2);
    box(DOOR_W, h - DOOR_H, T, c, DOOR_H + (h - DOOR_H)/2, z, {solid:true});   // header (you can bonk your head)
  }
  for (const s of s0) if (s[1] - s[0] > 0.02)
    box(s[1]-s[0], h, T, (s[0]+s[1])/2, h/2, z, {solid:true});
}
function wallZ(x, a, b, doors, h){          // wall running along Z at fixed x
  h = h || 3.2;
  let s0 = [[a, b]];
  for (const c of (doors || [])){
    s0 = cut(s0, c - DOOR_W/2, c + DOOR_W/2);
    box(T, h - DOOR_H, DOOR_W, x, DOOR_H + (h - DOOR_H)/2, c, {solid:true});
  }
  for (const s of s0) if (s[1] - s[0] > 0.02)
    box(T, h, s[1]-s[0], x, h/2, (s[0]+s[1])/2, {solid:true});
}
/* a wall between two arbitrary points (the hexagon needs these) */
function segWall(ax, az, bx, bz, h, t){
  const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz);
  const g = new THREE.BoxGeometry(L, h, t);
  const m = new THREE.Mesh(g, meshMat);
  m.position.set((ax+bx)/2, h/2, (az+bz)/2);
  m.rotation.y = Math.atan2(-dz, dx);
  scene.add(m); occluders.push(m);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), lineMat);
  e.position.copy(m.position); e.rotation.copy(m.rotation);
  scene.add(e);
  segs.push({ax, az, bx, bz, ht: t/2, y0: 0, y1: h});
  return m;
}

/* ============ hand-written labels (auto-shrink to fit) ============ */
function makeLabel(text, w, fontPx){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 150;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#141414';
  let f = (fontPx || 64) + 2;
  do {
    f -= 2;
    ctx.font = '700 ' + f + 'px "Comic Sans MS","Comic Neue","Segoe Print",cursive';
  } while (ctx.measureText(text).width > c.width - 60 && f > 16);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 512, 80);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  return new THREE.Mesh(new THREE.PlaneGeometry(w, w * 150 / 1024),
    new THREE.MeshBasicMaterial({map: tex, transparent: true}));
}
function hang(obj, x, y, z, face){
  obj.position.set(x, y, z);
  if (face === '+x') obj.rotation.y =  Math.PI/2;
  if (face === '-x') obj.rotation.y = -Math.PI/2;
  if (face === '-z') obj.rotation.y =  Math.PI;
  scene.add(obj);
  return obj;
}

/* ================================================================
   EDIT ME — everything written in the house lives right here.
   Every sign, book, sticky note, paper, picture and plaque reads
   from this object. Change text, add entries, save, refresh.

   CONTENT.work    -> the books in the library (your real PDFs)
   CONTENT.pictures-> the framed pictures in the trophy room
   ================================================================ */
const CONTENT = {
  name: 'Jessy Wang',
  tagline: 'math · AI · neuroscience',

  /* where the PDFs live, relative to this file. They currently sit next to
     it in the repo root; if you ever move them into pdfs/, put 'pdfs/' here. */
  docs: '',

  about: {
    title: 'about me',
    body: 'Hi, I\'m Jessy Wang, a senior at Laurel Springs School with a passion for math, AI, and neuroscience. My goal is to become a research scientist and create practical AI tools that make a real difference in people\'s lives. I believe technology should be used to simplify complex tasks and make them more accessible to everyone. Whether I\'m working on a research project, helping students understand new concepts, or developing educational software, my primary goal remains the same: to use technology to drive positive change and help people achieve their goals.\n\nI have a strong foundation in math, physics, and computer science, which helps me tackle tough problems in a logical and curious way. Some of the accolades I\'ve earned include a perfect score on the F=ma exam (ranked 1st among 6,682 participants), qualifying for several prestigious math and science competitions such as the USAMO, USAPhO, and USNCO, and reaching gold in the USACO Gold Division. What\'s really exciting for me, though, is applying this analytical way of thinking to my research at UPMC. I\'m working on using artificial intelligence to improve medical imaging, which has the potential to make a big impact on healthcare and scientific discovery. By combining machine learning with quantum tractography, I\'m exploring new ways to analyze and understand medical images, which could lead to better patient outcomes and new insights into the human body.\n\nI\'m passionate about helping others achieve their goals, beyond just my research work. After achieving a 1540 on the SAT, I was chosen as a volunteer tutor with Schoolhouse, where I dedicate several hours weekly to guiding students from varied backgrounds. This experience taught me that the most effective solution isn\'t always the most complex — it\'s the one that\'s easy for people to grasp, use, and benefit from. That realization motivated me to create the projects in this house, aiming to make learning more enjoyable, tailored, and accessible. These projects include arithmetic games, ear-training tools, and chess applications, all designed with the user in mind. My goal is to continue developing AI systems that solve real problems and empower those who use them, long after they\'re implemented.'
  },

  directory: {
    title: 'directory',
    body: 'NORTH — the library of babel (all my math work)\nWEST — writings · EAST — ideas\nSOUTH-WEST — about me · SOUTH-EAST — honors & awards\n\nthe orange door on the north wall leads out to the rest of the site:\nresearch, projects, résumé, socials\n\ncontrols\nwalk WASD · jump SPACE · sprint SHIFT\nlook — click once to capture the mouse\ngrab / read / place — E or click\ndrop — Q · menu — ESC'
  },

  /* the way out to the flat version of the site */
  frontDoor: {
    title: 'the rest of the site',
    body: 'Through this door is the scrolling version of jwang2007.github.io — research, projects, résumé, the searchable notes index, and links to LinkedIn and GitHub.\n\nEverything in this house is over there too, just in a page you can read on any device.',
    link: 'portfolio.html',
    linkText: 'open the portfolio ↗'

       title  – what the spine says when you aim at it

                'number theory' | 'calculus' | 'probability & logic'

  work: [

    { title:'Proof of the Infinitude of Primes', file:'infinite_primes.pdf', shelf:'number theory',

    { title:'USAMO 1976 Problem 3', file:'usamo_1976_p3.pdf', shelf:'number theory',

    { title:'MIT Integration Bee 2023 Problem 1', file:'integration_bee_2023_p1.pdf', shelf:'calculus',

const readables = [];
function markRead(meshes, entry){
  for (const m of meshes){ m.userData.read = entry; occluders.push(m); }
  if (!entry._pos){ entry._pos = new THREE.Vector3(); readables.push(entry); }
  entry._anchor = meshes[0];
}
function markGroupRead(g, entry){
  const ms = [];
  g.traverse(o => { if (o.isMesh) ms.push(o); });
  markRead(ms, entry);
}

/* ============ pickable items ============ */
const items = [];
function makeItem(id, name, x, y, z, build){
  const g = new THREE.Group();
  build(g);
  g.position.set(x, y + 0.002, z);
  g.rotation.y = Math.random() * Math.PI * 2;
  scene.add(g);
  const item = {id, name, group: g, meshes: []};
  g.traverse(o => {
    if (o.isMesh){ o.userData.item = item; item.meshes.push(o); occluders.push(o); }
  });
  items.push(item);
  return item;
}

   Atrium (spawn):  x -9..9,   z -2..8
   Writings:        x -16..-9, z -2..8    Ideas: x 9..16, z -2..8
   About me:        x -9..0,   z 8..15    Trophies: x 0..9, z 8..15

const ATR_H = 3.6, ROOM_H = 3.2, LIB_H = 6;
const SQ3_2 = Math.sqrt(3) / 2;
const HEX_R = 7, HOLE_R = 2.2, RAIL_R = 2.5;
const HEX_Z = -6 - SQ3_2 * HEX_R;                 // hexagon center z

function hexPts(cx, cz, R){
  const p = [];
  for (let k = 0; k < 6; k++){
    const a = k * Math.PI / 3;
    p.push([cx + R * Math.cos(a), cz + R * Math.sin(a)]);
  }
  return p;
}

const SLOT_X = [-1.95, -0.98, 0, 0.98, 1.95];
const SLOT_ORDER = [];                       // eye-level shelves get filled first

function buildShelfWall(A, B, subject, works){
  const dx = B[0]-A[0], dz = B[1]-A[1], L = Math.hypot(dx, dz);
  const nx = -dz/L, nz = dx/L;                          // inward normal
  const mx = (A[0]+B[0])/2, mz = (A[1]+B[1])/2;
  const D = 0.42, W = 5.6, H = 5.15;
  const off = T/2 + D/2 + 0.03;
  const g = new THREE.Group();
  g.position.set(mx + nx*off, 0, mz + nz*off);
  g.rotation.y = Math.atan2(nx, nz);
  scene.add(g);
  function cb(w,h,d,x,y,z,mm){
    const geo = new THREE.BoxGeometry(w,h,d);
    const m = new THREE.Mesh(geo, mm || PAL.wood); m.position.set(x,y,z);
    m.userData.surface = true;
    g.add(m); occluders.push(m);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat);
    e.position.copy(m.position); g.add(e);
    return m;
  }
  cb(0.1, H, D, -(W/2 - 0.05), H/2, 0);
  cb(0.1, H, D,  (W/2 - 0.05), H/2, 0);
  cb(W, 0.1, D, 0, H - 0.05, 0);
  cb(W, H, 0.05, 0, H/2, -D/2 + 0.03, PAL.cream);
  const SHELF_Y = [0.16, 0.98, 1.80, 2.62, 3.44, 4.26];
  for (const sy of SHELF_Y) cb(W - 0.2, 0.08, D - 0.08, 0, sy, 0);

  /* which slots the real books claim — the filler leaves room for them */
  const mine = (works || []).slice(0, SLOT_ORDER.length);
  const reserved = SLOT_ORDER.slice(0, mine.length);

  const buckets = BOOK_MATS.map(() => []);
  for (let si = 0; si < SHELF_Y.length; si++){
    const top = SHELF_Y[si] + 0.04;
    let x = -(W/2 - 0.28);
    while (x < W/2 - 0.3){
      if (rnd() < 0.10){ x += 0.16 + rnd()*0.15; continue; }
      const bw = 0.06 + rnd()*0.09;
      let skip = false;
      for (const r of reserved) if (r[0] === si && Math.abs(x - r[1]) < 0.30) skip = true;
      if (!skip){
        const bh = 0.26 + rnd()*0.17;
        buckets[(rnd() * buckets.length) | 0].push({w:bw, h:bh, d:0.26, x:x + bw/2, y:top + bh/2, z:0.02,
                   rz:(rnd() < 0.14 ? (rnd() - 0.5) * 0.3 : 0)});
      }
      x += bw + 0.012;
    }
  }
  for (let bi = 0; bi < buckets.length; bi++){
    if (!buckets[bi].length) continue;
    const mb = mergedBoxes(buckets[bi], BOOK_MATS[bi]);
    g.add(mb.fill); g.add(mb.edge); occluders.push(mb.fill);
  }

  /* the yellow spines: one per piece of work */
  mine.forEach((w, i) => {
    const slot = reserved[i];
    const geo = new THREE.BoxGeometry(0.11, 0.40, 0.30);
    const m = new THREE.Mesh(geo, yellowMat);
    m.position.set(slot[1], SHELF_Y[slot[0]] + 0.04 + 0.20, 0.06);
    m.rotation.z = ((i % 3) - 1) * 0.055;
    g.add(m);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat);
    e.position.copy(m.position); e.rotation.copy(m.rotation);
    g.add(e);
    markRead([m], w);
  });

  /* the subject, written on the wall above the shelf */
  const lbl = makeLabel(subject, 2.7, 70);
  lbl.position.set(0, H + 0.42, -0.19);        // just in front of the wall, above the shelf
  g.add(lbl);

  if ((works || []).length > SLOT_ORDER.length)
    console.warn('shelf "' + subject + '" has more works than slots; ' +
                 ((works.length) - SLOT_ORDER.length) + ' left off the wall');
  return {group:g, SHELF_Y};
}

const SHELF_SUBJECTS = ['number theory', 'calculus', 'probability & logic', 'physics, code & other'];
function worksOn(subject){
  const last = SHELF_SUBJECTS[SHELF_SUBJECTS.length - 1];
  return CONTENT.work.filter(w => (SHELF_SUBJECTS.indexOf(w.shelf) > -1 ? w.shelf : last) === subject);
}

function table(cx, cz, w, d, h, topMat){
  w = w || 1.6; d = d || 0.95; h = h || 0.78;
  const top = 0.09, inset = 0.16;
  box(w, top, d, cx, h - top/2, cz, {surface:true, mat: topMat || PAL.wood});
  for (const sx of [-1,1]) for (const sz of [-1,1]){
    const g = new THREE.Group();

    scene.add(g);
    part(g, new THREE.CylinderGeometry(0.05, 0.078, h - top, 8), 0, (h - top)/2, 0, 0, 0, 0, PAL.dark);
  }
  aabbs.push({x0:cx-w/2, x1:cx+w/2, z0:cz-d/2, z1:cz+d/2, y0:0, y1:h, land:true});
}

function plinth(cx, cz, capMat){

function crate(cx, cz, h){
  const s = 0.85;
  box(s, h, s, cx, h/2, cz, {solid:true, surface:true, mat: PAL.wood});
  const hw = s/2 * 1.002, xo = s/2 - 0.05, l = [];
  for (const sz of [-1,1]){
    l.push([cx-xo, 0.04, cz+sz*hw], [cx+xo, h-0.04, cz+sz*hw]);
    l.push([cx-xo, h-0.04, cz+sz*hw], [cx+xo, 0.04, cz+sz*hw]);
  }
  for (const sx of [-1,1]){
    l.push([cx+sx*hw, 0.04, cz-xo], [cx+sx*hw, h-0.04, cz+xo]);
    l.push([cx+sx*hw, h-0.04, cz-xo], [cx+sx*hw, 0.04, cz+xo]);
  }
  scene.add(linesFlat(l));
}

/* a framed picture on a wall: white mat, ink frame, image fitted inside */
const texLoader = new THREE.TextureLoader();
function framedPicture(entry, x, y, z, face, W, H){
  const g = new THREE.Group();
  g.position.set(x, y, z);
  if (face === '+x') g.rotation.y =  Math.PI/2;
  if (face === '-x') g.rotation.y = -Math.PI/2;
  if (face === '-z') g.rotation.y =  Math.PI;
  scene.add(g);
  const backing = part(g, new THREE.BoxGeometry(W, H, 0.07), 0, 0, 0, 0, 0, 0, meshMat);
  const iw = W - 0.20, ih = H - 0.20;
  const pic = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
                             new THREE.MeshBasicMaterial({color: 0xffffff}));
  pic.position.set(0, 0, 0.042);
  pic.scale.set(iw, ih, 1);
  g.add(pic);
  /* no photo? then it reads as a framed certificate: ruled lines, ink on white */
  let scribbled = null;
  function scribble(){
    if (scribbled) return;
    const l = [], n = 5, top = ih/2 - 0.16;
    for (let i = 0; i < n; i++){
      const y = top - i * (ih - 0.32) / (n - 1);
      const half = (i === 0 ? 0.30 : 0.40) * iw * (i === n - 1 ? 0.6 : 1);
      l.push([-half, y, 0.05], [half, y, 0.05]);
    }
    scribbled = linesFlat(l);
    g.add(scribbled);
  }
  if (entry.image){
    texLoader.load(entry.image, tex => {
      tex.anisotropy = 4;
      const im = tex.image;
      const a = (im && im.width && im.height) ? im.width / im.height : 1;
      let w = iw, h = iw / a;
      if (h > ih){ h = ih; w = ih * a; }
      pic.scale.set(w, h, 1);
      pic.material.map = tex; pic.material.needsUpdate = true;
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, h)), lineMat);
      e.position.copy(pic.position); g.add(e);
    }, undefined, scribble);        // missing file / file:// — fall back to the ruled certificate
  } else scribble();
  const lbl = makeLabel(entry.title, W * 0.92, 74);
  lbl.position.set(0, -H/2 - 0.17, 0.04);
  g.add(lbl);
  markRead([backing, pic], entry);
  return g;
}

/* ============ carrying: one item in hand, held out in front of you ============ */
const REACH = 2.8;
let held = null;
const carryPos = new THREE.Vector3(), _carryT = new THREE.Vector3();
const ray = new THREE.Raycaster(); ray.far = REACH;
const CENTER = new THREE.Vector2(0, 0);

/* ============ aiming: precise ray first, then a forgiving cone ============ */
const aimtip = document.getElementById('aimtip');
const _aim = new THREE.Vector3();
const aimRay = new THREE.Raycaster();

function aimedTarget(){
  ray.far = REACH;
  ray.setFromCamera(CENTER, camera);
  const hits = ray.intersectObjects(occluders, false);
  if (hits.length){
    const o = hits[0].object;
    if (o.userData.read)    return {kind:'read', entry:o.userData.read};
    if (o.userData.item)    return {kind:'item', item:o.userData.item};
    if (o.userData.surface) return {kind:'surface', hit:hits[0]};
    return null;                             // a wall — blocks everything behind it
  }
  /* aim assist: small things within a ~6 degree cone (with line of sight) count */
  let best = null, bestAng = 0.105;
  for (const it of items){
    if (it === held) continue;
    _aim.copy(it.group.position); _aim.y += 0.08;
    _aim.sub(ray.ray.origin);
    const d = _aim.length();
    if (d > REACH) continue;
    const a = ray.ray.direction.angleTo(_aim);
    if (a < bestAng){ bestAng = a; best = {kind:'item', item:it, px:it.group.position.x, py:it.group.position.y + 0.08, pz:it.group.position.z, d}; }
  }
  for (const r of readables){
    _aim.copy(r._pos).sub(ray.ray.origin);
    const d = _aim.length();
    if (d > REACH) continue;
    const a = ray.ray.direction.angleTo(_aim);
    if (a < bestAng){ bestAng = a; best = {kind:'read', entry:r, px:r._pos.x, py:r._pos.y, pz:r._pos.z, d}; }
  }
  if (best){
    _aim.set(best.px, best.py, best.pz).sub(ray.ray.origin).normalize();
    aimRay.set(ray.ray.origin, _aim);
    aimRay.far = best.d + 0.25;
    const vh = aimRay.intersectObjects(occluders, false);
    if (vh.length){
      const o = vh[0].object;
      if (best.kind === 'item' && o.userData.item === best.item) return {kind:'item', item:best.item};
      if (best.kind === 'read' && o.userData.read === best.entry) return {kind:'read', entry:best.entry};
    }
  }
  return null;
}
function updateAim(){
  if (paused()){ aimtip.style.display = 'none'; return; }
  const t = aimedTarget();
  let txt = '';
  if (t && t.kind === 'read')
    txt = (t.entry.link ? 'go to: '
        : (t.entry.catalogue || t.entry.file || t.entry.files) ? 'open: '
        : 'read: ') + t.entry.title;
  else if (t && t.kind === 'item') txt = held ? 'hands full' : 'grab: ' + t.item.name;
  else if (t && t.kind === 'surface' && held) txt = 'place: ' + held.name;
  if (txt){ aimtip.textContent = txt; aimtip.style.display = 'block'; }
  else aimtip.style.display = 'none';
}

/* ============ the reading overlay ============
   Four kinds of readable:
     text      – anything with a .body
     document  – .file (or .files) : the real PDF, opened in-world
     picture   – .image
     catalogue – the whole of CONTENT.work as a clickable list
   ============================================================== */
const readerEl = document.getElementById('reader'), rback = document.getElementById('rback');
const rtitle = document.getElementById('rtitle'), rbody = document.getElementById('rbody');
const rmeta  = document.getElementById('rmeta'),  rhint = document.getElementById('rhint');
const rbackBtn = document.getElementById('rbackbtn');
let reading = null;
const readerStack = [];
let relockAfterRead = false, intentionalUnlock = false;

const LOCAL_FILE = location.protocol === 'file:';
const docURL = f => CONTENT.docs + f;
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function tagsOf(w){
  const bits = [].concat(w.type || [], w.source || [], w.field || [], w.proofMethod || [], w.technique || []);
  return bits.map(b => '<span class="tag">' + esc(b) + '</span>').join('');
}
function hintRow(left, url){
  const close = isTouch ? 'tap ✕ to close' : 'E / right-click / Esc closes';
  rhint.innerHTML = '<span>' + esc(left || close) + '</span>' +
    (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">open in a new tab ↗</a>' : '');
}

/* --- a document (PDF, or any other file shown as text) --- */
function showDoc(w){
  const files = w.files || [{file: w.file, label: ''}];
  readerEl.classList.add('wide');
  rbody.className = 'doc';
  rbody.innerHTML =
    (files.length > 1
      ? '<div class="rtabs">' + files.map((f, i) =>
          '<button class="rtab' + (i ? '' : ' on') + '" data-i="' + i + '">' +
          esc(f.label || ('file ' + (i + 1))) + '</button>').join('') + '</div>'
      : '') +
    (LOCAL_FILE ? '<div class="warn">You opened this page straight off the disk, so the browser will not ' +
                  'load the file into it. Run a local server (python3 -m http.server) or view it on the ' +
                  'site — or use the link below.</div>' : '') +
    '<div class="rframe"></div>';
  const frame = rbody.querySelector('.rframe');
  function load(i){
    const f = files[i], url = docURL(f.file);
    hintRow(files.length > 1 ? (f.label || f.file) : '', url);
    if (/\.pdf$/i.test(f.file)){
      frame.innerHTML = '<iframe src="' + esc(url) + '#view=FitH" title="' + esc(w.title) + '"></iframe>';
    } else {
      frame.innerHTML = '<pre class="code">loading…</pre>';
      fetch(url).then(r => r.text()).then(t => {
        frame.innerHTML = '<pre class="code"></pre>';
        frame.firstChild.textContent = t;
      }).catch(() => {
        frame.innerHTML = '<pre class="code">Could not load ' + esc(f.file) +
                          ' from here — try the link below.</pre>';
      });
    }
  }
  rbody.onclick = e => {                     // onclick, not addEventListener: one handler at a time
    const t = e.target.closest('.rtab');
    if (!t) return;
    rbody.querySelectorAll('.rtab').forEach(b => b.classList.toggle('on', b === t));
    load(+t.dataset.i);
  };
  load(0);
}

/* --- a framed picture --- */
function showPicture(w){
  rbody.className = 'pic';
  rbody.innerHTML = (w.image ? '<img src="' + esc(w.image) + '" alt="' + esc(w.title) + '">' : '') +
                    (w.body ? '<div class="cap"></div>' : '');
  if (w.body) rbody.querySelector('.cap').textContent = w.body;
  hintRow('', w.image);
}

/* --- the catalogue: everything in CONTENT.work, grouped by field --- */
function showCatalogue(){
  rbody.className = 'cat';
  const groups = new Map();
  CONTENT.work.forEach((w, i) => {
    const k = (w.field && w.field[0]) || 'olympiad problems';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(i);
  });
  let html = '';
  for (const [k, idx] of groups){
    html += '<div class="cgh">' + esc(k.toLowerCase()) + ' · ' + idx.length + '</div><ul class="clist">';
    for (const i of idx){
      const w = CONTENT.work[i];
      const sub = [].concat(w.source || [], w.technique || [], w.proofMethod || []).join(' · ');
      html += '<li><button class="crow" data-i="' + i + '">' + esc(w.title) +
              (sub ? '<em>' + esc(sub) + '</em>' : '') + '</button></li>';
    }
    html += '</ul>';
  }
  rbody.innerHTML = html;
  rbody.onclick = e => {
    const b = e.target.closest('.crow');
    if (b) openReading(CONTENT.work[+b.dataset.i], true);
  };
  rmeta.innerHTML = '<span class="tag">' + CONTENT.work.length + ' pieces</span>' +
                    '<span class="tag">click one to read it</span>';
  hintRow('');
}

function renderReading(en){
  rtitle.textContent = en.title;
  rmeta.innerHTML = '';
  rbody.className = '';
  rbody.innerHTML = '';
  rbody.onclick = null;
  rbody.scrollTop = 0;
  readerEl.classList.remove('wide');
  if (en.catalogue){ showCatalogue(); return; }
  if (en.file || en.files){ rmeta.innerHTML = tagsOf(en); showDoc(en); return; }
  if (en.image){ showPicture(en); return; }
  rbody.textContent = en.body || '';
  if (en.link){                                  // a readable that is really a way out
    const a = document.createElement('a');
    a.className = 'golink';
    a.href = en.link;
    a.textContent = en.linkText || 'open ↗';
    rbody.appendChild(a);
  }
  hintRow(isTouch ? 'tap ✕ to close' : 'E / right-click / Esc closes · scroll to read');
}
function openReading(en, push){
  if (push && reading) readerStack.push(reading);
  else if (!push) readerStack.length = 0;
  reading = en;
  renderReading(en);
  rbackBtn.style.display = readerStack.length ? 'block' : 'none';
  rback.style.display = 'block';
  readerEl.style.display = 'block';
  aimtip.style.display = 'none';
  if (locked()){                       // you need the cursor back to click around in here
    relockAfterRead = true;
    intentionalUnlock = true;
    document.exitPointerLock();
  }
}
function closeReading(){
  reading = null;
  readerStack.length = 0;
  rbody.innerHTML = '';
  rbody.className = '';
  rback.style.display = 'none';
  readerEl.style.display = 'none';
  readerEl.classList.remove('wide');
  rbackBtn.style.display = 'none';
  if (relockAfterRead){ relockAfterRead = false; tryLock(); }
}
rbackBtn.addEventListener('click', () => {
  const prev = readerStack.pop();
  if (!prev) return;
  reading = prev;
  renderReading(prev);
  rbackBtn.style.display = readerStack.length ? 'block' : 'none';
});
document.getElementById('rclose').addEventListener('click', closeReading);
rback.addEventListener('click', closeReading);

/* ============ interact: read / grab / place ============ */
let cheesed = false;
function grabItem(item){
  held = item;
  for (const m of item.meshes){
    const i = occluders.indexOf(m);
    if (i > -1) occluders.splice(i, 1);      // your own hands should not block your aim
  }
  carryPos.copy(item.group.position);         // it glides up into your hands
  if (item.id === 'cheese' && !cheesed){
    cheesed = true;
    showToast('Ew. You actually picked up the mystery cheese. That is SO gross.');
  }
}
function placeHeld(hit){
  const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  if (n.y < 0.7){ showToast("It won't balance there."); return; }
  held.group.position.set(hit.point.x, hit.point.y + 0.002, hit.point.z);
  held.group.rotation.set(0, player.yaw + (Math.random() - 0.5) * 0.8, 0);
  occluders.push(...held.meshes);
  held = null;
}
function dropHeld(){
  if (!held) return;
  const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
  let px = player.x + fx * 0.9, pz = player.z + fz * 0.9;
  if (horizBlocked(px, pz, player.y)){ px = player.x; pz = player.z; }
  let gy = 0;
  for (const c of aabbs){
    if (!c.land) continue;
    if (c.y1 <= player.y + 1.1 && c.y1 > gy && overlapA(c, px, pz, 0.05)) gy = c.y1;
  }
  held.group.position.set(px, gy + 0.002, pz);
  held.group.rotation.set(0, Math.random() * Math.PI * 2, 0);
  occluders.push(...held.meshes);
  held = null;
}
function interact(){
  if (menuOpen()) return;
  if (reading){ closeReading(); return; }
  const t = aimedTarget();
  if (t && t.kind === 'read'){ openReading(t.entry); return; }
  if (!held){
    if (t && t.kind === 'item') grabItem(t.item);
    return;
  }
  if (t && t.kind === 'surface'){ placeHeld(t.hit); return; }
  if (t && t.kind === 'item'){ showToast('Hands full — place it somewhere, or Q to drop.'); return; }
  dropHeld();                                  // aimed at a wall or nothing: just set it down
}
addEventListener('wheel', e => {
  if (reading && !readerEl.contains(e.target)) rbody.scrollTop += e.deltaY;
}, {passive:true});

/* ============ player + physics ============ */
const player = {x:0, z:5.2, y:0, vy:0, yaw:0, pitch:0, r:0.32};
const PH = 1.7, STEPUP = 0.56, GRAV = 17, JUMPV = 5.6;
let onGround = true, jumpQ = 0, camYs = 0;
const keys = {};
const clampPitch = p => Math.max(-1.56, Math.min(1.56, p));

function overlapA(c, x, z, r){
  return x > c.x0 - r && x < c.x1 + r && z > c.z0 - r && z < c.z1 + r;
}
function segD2(px, pz, s){
  const dx = s.bx - s.ax, dz = s.bz - s.az;
  const l2 = dx*dx + dz*dz;
  let t = l2 ? ((px - s.ax)*dx + (pz - s.az)*dz) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = s.ax + dx*t - px, cz = s.az + dz*t - pz;
  return cx*cx + cz*cz;
}
function horizBlocked(x, z, y){
  const r = player.r, top = y + PH;
  for (const c of aabbs){
    if (c.y0 >= top || c.y1 <= y + STEPUP) continue;   // step over low things, walk under high ones
    if (overlapA(c, x, z, r)) return true;
  }
  for (const s of segs){
    if (s.y0 >= top || s.y1 <= y + STEPUP) continue;
    const rr = r + s.ht;
    if (segD2(x, z, s) < rr*rr) return true;
  }
  return false;
}
const SHAFT_N = [Math.PI/6, Math.PI/2, Math.PI*5/6].map(a => [Math.cos(a), Math.sin(a)]);
function inShaft(x, z){              // inside the hexagonal shaft hole: there is no floor
  const pz = z - HEX_Z;
  for (const n of SHAFT_N)
    if (Math.abs(x * n[0] + pz * n[1]) > 1.87) return false;
  return true;
}
function groundAt(x, z, y){
  let g = inShaft(x, z) ? -999 : 0;
  for (const c of aabbs){
    if (!c.land) continue;
    if (c.y1 > y + STEPUP || c.y1 <= g) continue;
    if (overlapA(c, x, z, player.r)) g = c.y1;
  }
  return g;
}

/* control state */
let everLocked = false, unlockAt = 0, relockT = 0;
let canLock = true, isTouch = false, dragging = false, lx = 0, ly = 0;
const locked = () => document.pointerLockElement === canvas;

addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (reading){
    if (e.code === 'KeyE' && !e.repeat) closeReading();
    return;
  }
  keys[e.code] = true;
  if (e.code === 'KeyE' && !e.repeat) interact();
  if (e.code === 'KeyQ' && !e.repeat) dropHeld();
  if (e.code === 'KeyP' && !e.repeat)
    showToast('x ' + player.x.toFixed(1) + ' · z ' + player.z.toFixed(1) +
              ' · yaw ' + Math.round(player.yaw * 180 / Math.PI) + '°');
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mvx = 0; mvy = 0; dragging = false; });

/* pointer lock (with smooth raw input where supported, and a cooldown-aware retry) */
function lockFailed(){
  if (everLocked){ showToast('The browser needs a second before recapturing — click again.'); return; }
  if (!canLock) return;
  canLock = false;
  showToast('Mouse capture is blocked here, so drag to look around instead.');
}
function tryLock(isRetry){
  if (isTouch || !canLock || locked()) return;
  let p;
  try { p = canvas.requestPointerLock({unadjustedMovement:true}); }
  catch (err){
    try { p = canvas.requestPointerLock(); }
    catch (e2){ lockFailed(); return; }
  }
  if (p && p.catch) p.catch(() => {
    if (!everLocked){ lockFailed(); return; }
    if (!isRetry){
      clearTimeout(relockT);
      relockT = setTimeout(() => { if (!locked() && !menuOpen() && !reading) tryLock(true); }, 1350);
    } else showToast('click once more to recapture the mouse');
  });
}
canvas.addEventListener('click', () => {
  if (locked()){ rightClickInteract(); return; }
  if (menuOpen()) closeMenu();
  tryLock();
});
document.addEventListener('pointerlockerror', lockFailed);

/* right-click / two-finger tap = interact (deduped across the event paths) */
let lastInteract = 0;
function rightClickInteract(){
  const now = performance.now();
  if (now - lastInteract < 150) return;
  lastInteract = now;
  interact();
}
canvas.addEventListener('mousedown', e => {
  if (e.button === 2){ rightClickInteract(); return; }
  dragging = true; lx = e.clientX; ly = e.clientY;
});
addEventListener('mousemove', e => {
  if (locked()){
    if (reading || menuOpen()) return;
    const mx = Math.max(-60, Math.min(60, e.movementX || 0));
    const my = Math.max(-60, Math.min(60, e.movementY || 0));
    player.yaw   -= mx * 0.0032;
    player.pitch  = clampPitch(player.pitch - my * 0.0032);
    return;
  }
  if (!dragging || menuOpen() || reading) return;
  player.yaw   -= (e.clientX - lx) * 0.0052;
  player.pitch  = clampPitch(player.pitch - (e.clientY - ly) * 0.0052);
  lx = e.clientX; ly = e.clientY;
});
addEventListener('mouseup', e => {
  dragging = false;
  if (e.button === 2) rightClickInteract();
});
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  rightClickInteract();
});

/* touch: left half = walk stick, right half = look; on-screen JUMP / USE buttons */
const stickEl = document.getElementById('stick'), knob = document.getElementById('knob');
const mbtns = document.getElementById('mbtns');
let moveId = null, lookId = null, mox = 0, moy = 0, mvx = 0, mvy = 0, llx = 0, lly = 0;
if (matchMedia('(pointer:coarse)').matches) mbtns.style.display = 'flex';
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  isTouch = true;
  mbtns.style.display = 'flex';
  for (const t of e.changedTouches){
    if (t.clientX < innerWidth/2 && moveId === null){
      moveId = t.identifier; mox = t.clientX; moy = t.clientY; mvx = 0; mvy = 0;
      stickEl.style.display = 'block';
      stickEl.style.left = (mox - 48) + 'px'; stickEl.style.top = (moy - 48) + 'px';
      knob.style.transform = 'translate(0,0)';
    } else if (lookId === null){
      lookId = t.identifier; llx = t.clientX; lly = t.clientY;
    }
  }
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches){
    if (t.identifier === moveId){
      const dx = t.clientX - mox, dy = t.clientY - moy;
      const m = Math.hypot(dx, dy), cap = 44, k = m > cap ? cap/m : 1;
      mvx = dx*k/cap; mvy = dy*k/cap;
      knob.style.transform = 'translate(' + dx*k + 'px,' + dy*k + 'px)';
    } else if (t.identifier === lookId){
      player.yaw   -= (t.clientX - llx) * 0.006;
      player.pitch  = clampPitch(player.pitch - (t.clientY - lly) * 0.006);
      llx = t.clientX; lly = t.clientY;
    }
  }
}, {passive:false});
function endTouch(e){
  for (const t of e.changedTouches){
    if (t.identifier === moveId){ moveId = null; mvx = mvy = 0; stickEl.style.display = 'none'; }
    if (t.identifier === lookId)  lookId = null;
  }
}
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);
const btnJump = document.getElementById('btnJump'), btnUse = document.getElementById('btnUse');
function pressJump(e){ e.preventDefault(); isTouch = true; jumpQ = performance.now(); }
function pressUse(e){ e.preventDefault(); isTouch = true; interact(); }
btnJump.addEventListener('touchstart', pressJump, {passive:false});
btnUse.addEventListener('touchstart', pressUse, {passive:false});
btnJump.addEventListener('mousedown', e => { e.preventDefault(); jumpQ = performance.now(); });
btnUse.addEventListener('mousedown', e => { e.preventDefault(); interact(); });

/* ============ settings menu (Esc opens it) ============ */
const settingsEl = document.getElementById('settings');
const fovSlider  = document.getElementById('fov'), fovVal = document.getElementById('fovVal');
let baseFov = 70, fovCurrent = 70;

function menuOpen(){ return settingsEl.style.display === 'block'; }
function paused(){ return menuOpen() || !!reading; }
function openMenu(){ settingsEl.style.display = 'block'; }
function closeMenu(){ settingsEl.style.display = 'none'; }
fovSlider.addEventListener('input', () => {
  baseFov = +fovSlider.value;
  fovVal.textContent = fovSlider.value;
});
document.getElementById('resume').addEventListener('click', () => { closeMenu(); tryLock(); });
document.getElementById('respawn').addEventListener('click', () => {
  player.x = 0; player.z = 5.2; player.y = 0; player.vy = 0;
  player.yaw = 0; player.pitch = 0; camYs = 0;

});

document.addEventListener('pointerlockchange', () => {
  if (locked()){ everLocked = true; closeMenu(); }
  else if (everLocked && !isTouch){
    unlockAt = performance.now();
    for (const k in keys) keys[k] = false;
    if (intentionalUnlock){ intentionalUnlock = false; return; }   // we let go on purpose, to read
    if (reading){ relockAfterRead = false; closeReading(); showToast('click anywhere to keep exploring'); }
    else openMenu();
  }
});
addEventListener('keydown', e => {
  if (e.code !== 'Escape' || locked()) return;
  if (reading){ closeReading(); return; }
  if (performance.now() - unlockAt < 400) return;
  menuOpen() ? closeMenu() : openMenu();
});

/* ============ regions ============ */
function region(x, z){
  if (z < -6)  return 'The Library of Babel';
  if (z < -2)  return 'The Corridor';
  if (z < 8){
    if (x < -9) return 'Writings';
    if (x >  9) return 'Ideas';
    return 'The Atrium';
  }
  return x < 0 ? 'About Me' : 'The Trophy Room';
}
const locEl = document.getElementById('loc'), toast = document.getElementById('toast');
let lastRegion = '', toastTimer = 0;
function showToast(t){
  toast.textContent = t; toast.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.style.opacity = 0, 2800);
}
setTimeout(() => showToast('v18 · click to look around · WASD walks · the library is north'), 700);

/* ============ main loop ============ */
const clock = new THREE.Clock();
const _look = new THREE.Vector3();
const _eul = new THREE.Euler(0, 0, 0, 'YXZ');
/* how much look-up/down the shift lens absorbs before the camera really tilts.
   0.55 keeps verticals dead straight for normal viewing; set to 0 for raw
   Minecraft-style projection where verticals lean as soon as you pitch. */
const VERT_KEEP = 0.55;
const xh = document.getElementById('xh');
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const inMenu = paused();

  let f = 0, s = 0;
  if (!inMenu){
    if (keys.KeyW || keys.ArrowUp)   f += 1;
    if (keys.KeyS || keys.ArrowDown) f -= 1;
    if (keys.KeyA) s -= 1;
    if (keys.KeyD) s += 1;
    if (keys.ArrowLeft)  player.yaw += 2.3 * dt;
    if (keys.ArrowRight) player.yaw -= 2.3 * dt;
    f += -mvy; s += mvx;
  }
  const L = Math.hypot(f, s);
  if (L > 1){ f /= L; s /= L; }

  const sprintKey = keys.ShiftLeft || keys.ShiftRight;
  const sp  = sprintKey ? 5.8 : 3.4;
  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  const dx = ( s*cos - f*sin) * sp * dt;
  const dz = (-f*cos - s*sin) * sp * dt;
  if (!horizBlocked(player.x + dx, player.z, player.y)) player.x += dx;
  if (!horizBlocked(player.x, player.z + dz, player.y)) player.z += dz;

  /* vertical: gravity, head bonks, landing on whatever is under you */
  player.vy -= GRAV * dt;
  let ny = player.y + player.vy * dt;
  if (player.vy > 0){
    let lim = Infinity;
    for (const c of aabbs){
      if (c.y0 >= player.y + PH - 0.06 && c.y0 < lim && overlapA(c, player.x, player.z, player.r)) lim = c.y0;
    }
    if (ny + PH > lim){ ny = lim - PH; player.vy = 0; }
  }
  const gnd = groundAt(player.x, player.z, player.y);
  if (player.vy <= 0 && ny <= gnd){ ny = gnd; player.vy = 0; onGround = true; }
  else onGround = false;
  player.y = ny;
  if (player.y < -26){                 // fell down the library shaft
    player.x = 0; player.z = HEX_Z + 4.4; player.y = 0; player.vy = 0; camYs = 0;
    showToast('The Library is a sphere. You are not. (respawned)');
  }
  if (onGround && !inMenu && (keys.Space || performance.now() - jumpQ < 200)){
    player.vy = JUMPV; onGround = false; jumpQ = 0;
  }
  camYs += (player.y - camYs) * Math.min(1, dt * 14);
  if (Math.abs(player.y - camYs) < 0.002) camYs = player.y;

  /* dynamic FOV: widens slightly while sprinting */
  const moving = (f !== 0 || s !== 0);
  const sprinting = sprintKey && moving;
  fovCurrent += (baseFov * (sprinting ? 1.12 : 1) - fovCurrent) * Math.min(1, dt * 9);
  camera.fov = fovCurrent;

  /* first-person camera. Orientation is built directly as yaw-about-world-up then
     pitch (a quaternion), so the horizon can never roll. On top of that, VERT_KEEP
     vertical correction: for everyday viewing angles the pitch is absorbed by a
     "shift lens" (a sheared projection), which keeps the world's vertical lines
     PERFECTLY vertical on screen. Only steep looks up/down smoothly hand over to a
     real camera tilt — which is exactly when things look square head-on anyway. */
  const cp = Math.cos(player.pitch);
  _look.set(-Math.sin(player.yaw) * cp, Math.sin(player.pitch), -Math.cos(player.yaw) * cp);
  camera.position.set(player.x, 1.62 + camYs, player.z);
  const shift = VERT_KEEP > 0.001 ? VERT_KEEP * Math.tanh(player.pitch / VERT_KEEP) : 0;
  const tilt  = player.pitch - shift;
  _eul.set(tilt, player.yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(_eul);
  camera.updateProjectionMatrix();
  camera.projectionMatrix.elements[9] = Math.tan(shift) / Math.tan(camera.fov * Math.PI / 360);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();

  /* the carried item floats out in front of you, with a little lag */
  if (held){
    _carryT.copy(camera.position).addScaledVector(_look, 0.85);
    _carryT.y -= 0.34;
    carryPos.lerp(_carryT, Math.min(1, dt * 12));
    held.group.position.copy(carryPos);
    held.group.rotation.set(0, player.yaw, 0);
  }

  const rgn = region(player.x, player.z);
  if (rgn !== lastRegion){ lastRegion = rgn; locEl.textContent = rgn; }

  xh.style.display = inMenu ? 'none' : 'block';
  camera.updateMatrixWorld();
  updateAim();

  renderer.render(scene, camera);
}

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
tick();
})();
</script>
</body>
</html>
