const aimtip = document.getElementById('aimtip');
const AIM_PTS = [
  new THREE.Vector2( 0,     0    ),
  new THREE.Vector2( 0,     0.026),
  new THREE.Vector2( 0,    -0.026),
  new THREE.Vector2( 0.026, 0    ),
  new THREE.Vector2(-0.026, 0    )
];

function aimedTarget(){
  let surface = null;
  for (const p of AIM_PTS){
    ray.far = REACH;
    ray.setFromCamera(p, camera);
    const hits = ray.intersectObjects(occluders, false);
    if (!hits.length) continue;
    const o = hits[0].object;
    if (o.userData.read) return {kind:'read', entry:o.userData.read};
    if (o.userData.item) return {kind:'item', item:o.userData.item};
    if (o.userData.surface && !surface) surface = {kind:'surface', hit:hits[0]};
    /* a plain wall: it blocks this sample, but a neighbouring one may still land */
  }
  return surface;
}
function updateAim(){
  if (paused()){ aimtip.style.display = 'none'; return; }
  const t = aimedTarget();
  let txt = '';
  if (t && t.kind === 'read')
    txt = (t.entry.link ? 'go to: '
        : (t.entry.filters || t.entry.shelfList ||
           t.entry.file || t.entry.files) ? 'open: '
        : 'read: ') + t.entry.title;
  else if (t && t.kind === 'item') txt = held ? 'hands full' : 'grab: ' + t.item.name;
  else if (t && t.kind === 'surface' && held) txt = 'place: ' + held.name;
  if (txt){ aimtip.textContent = txt; aimtip.style.display = 'block'; }
  else aimtip.style.display = 'none';
}

/* ============ the reading overlay ============
   Four kinds of readable:
     text      – anything with a .body
     document  – .file (or .files) : the real PDF, opened in-world
     picture   – .image
   ============================================================== */
const readerEl = document.getElementById('reader'), rback = document.getElementById('rback');
const rtitle = document.getElementById('rtitle'), rbody = document.getElementById('rbody');
const rmeta  = document.getElementById('rmeta'),  rhint = document.getElementById('rhint');
const rbackBtn = document.getElementById('rbackbtn');
let reading = null;
const readerStack = [];
let relockAfterRead = false, intentionalUnlock = false;

const LOCAL_FILE = location.protocol === 'file:';
const docURL = f => CONTENT.docs + f;
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function tagsOf(w){
  const bits = [].concat(w.type || [], w.source || [], w.field || [], w.proofMethod || [], w.technique || []);
  return bits.map(b => '<span class="tag">' + esc(b) + '</span>').join('');
}
function hintRow(left, url){
  const close = isTouch ? 'tap ✕ to close' : 'E / right-click / Esc closes';
  rhint.innerHTML = '<span>' + esc(left || close) + '</span>' +
    (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">open in a new tab ↗</a>' : '');
}

/* --- a document (PDF, or any other file shown as text) --- */
function showDoc(w){
  const files = w.files || [{file: w.file, label: ''}];
  readerEl.classList.add('wide');
  rbody.className = 'doc';
  rbody.innerHTML =
    (files.length > 1
      ? '<div class="rtabs">' + files.map((f, i) =>
          '<button class="rtab' + (i ? '' : ' on') + '" data-i="' + i + '">' +
          esc(f.label || ('file ' + (i + 1))) + '</button>').join('') + '</div>'
      : '') +
    (LOCAL_FILE ? '<div class="warn">You opened this page straight off the disk, so the browser will not ' +
                  'load the file into it. Run a local server (python3 -m http.server) or view it on the ' +
                  'site — or use the link below.</div>' : '') +
    '<div class="rframe"></div>';
  const frame = rbody.querySelector('.rframe');
  function load(i){
    const f = files[i], url = docURL(f.file);
    hintRow(files.length > 1 ? (f.label || f.file) : '', url);
    if (/\.pdf$/i.test(f.file)){
      frame.innerHTML = '<iframe src="' + esc(url) + '#view=FitH" title="' + esc(w.title) + '"></iframe>';
    } else {
      frame.innerHTML = '<pre class="code">loading…</pre>';
      fetch(url).then(r => r.text()).then(t => {
        frame.innerHTML = '<pre class="code"></pre>';
        frame.firstChild.textContent = t;
      }).catch(() => {
        frame.innerHTML = '<pre class="code">Could not load ' + esc(f.file) +
                          ' from here — try the link below.</pre>';
      });
    }
  }
  rbody.onclick = e => {                     // onclick, not addEventListener: one handler at a time
    const t = e.target.closest('.rtab');
    if (!t) return;
    rbody.querySelectorAll('.rtab').forEach(b => b.classList.toggle('on', b === t));
    load(+t.dataset.i);
  };
  load(0);
}

/* --- a framed picture --- */
function showPicture(w){
  rbody.className = 'pic';
  rbody.innerHTML = (w.image ? '<img src="' + esc(w.image) + '" alt="' + esc(w.title) + '">' : '') +
                    (w.body ? '<div class="cap"></div>' : '');
  if (w.body) rbody.querySelector('.cap').textContent = w.body;
  hintRow('', w.image);
}

/* --- the little case: everything on this room's shelves, as a list --- */
function showShelfList(en){
  const G = galleries[en.depth];
  rbody.className = 'desk';
  if (!G){ rbody.textContent = 'This room is no longer here.'; return; }
  rmeta.innerHTML = '<span class="tag">' + G.works.length +
                    (G.works.length === 1 ? ' file' : ' files') + '</span>' +
                    G.chain.map(c => '<span class="tag">' + esc(c.label + ': ' + c.value) + '</span>').join('');
  /* Each tile is the document itself, shrunk: the real PDF rendered at
     one-eighth scale inside a clipped frame. They load only as they scroll
     into view, so opening the shelf does not fetch every proof at once. */
  let html = '<div class="dgrid">';
  G.works.forEach((w, i) => {
    const files = w.files || [{file: w.file}];
    const f = files[0].file || '';
    const isPdf = /\.pdf$/i.test(f);
    html += '<button class="dfile" data-i="' + i + '" title="' + esc(w.title) + '">' +
              '<span class="dthumb"' + (files.length > 1 ? ' data-stack="1"' : '') + '>' +
                (isPdf ? '<iframe data-src="' + esc(docURL(f)) +
                         '#toolbar=0&navpanes=0&scrollbar=0&view=Fit" loading="lazy"' +
                         ' tabindex="-1" aria-hidden="true"></iframe>'
                       : '<pre class="dcode" data-src="' + esc(docURL(f)) + '"></pre>') +
              '</span>' +
              '<span class="dname">' + esc(w.title) + '</span>' +
            '</button>';
  });
  rbody.innerHTML = html + '</div>';
  const io = new IntersectionObserver((entries, obs) => {
    for (const en2 of entries){
      if (!en2.isIntersecting) continue;
      const el = en2.target;
      obs.unobserve(el);
      if (el.tagName === 'IFRAME'){ el.src = el.dataset.src; }
      else fetch(el.dataset.src).then(r => r.text())
             .then(t => { el.textContent = t.slice(0, 4000); })
             .catch(() => { el.textContent = ''; });
    }
  }, {root: rbody, rootMargin: '220px'});
  rbody.querySelectorAll('[data-src]').forEach(el => io.observe(el));
  rbody.onclick = e => {
    const b = e.target.closest('.dfile');
    if (b) openReading(G.works[+b.dataset.i], true);
  };
  readerEl.classList.add('wide');
  hintRow('click a file to open it');
}

/* --- the lectern: which filter opens the next gallery --- */
function showFilters(en){
  const G = galleries[en.depth];
  rbody.className = 'cat';
  if (!G){ rbody.textContent = 'This room is no longer here.'; return; }
  const opts = facetOptions(G.works, G.chain);
  G.opts = opts;
  rmeta.innerHTML = '<span class="tag">' + G.works.length +
                    (G.works.length === 1 ? ' piece' : ' pieces') + ' in this room</span>' +
                    G.chain.map(c => '<span class="tag">' + esc(c.label + ': ' + c.value) + '</span>').join('');
  let html = '';
  if (!opts.length){
    html = '<div class="warn">Nothing here narrows any further — every piece in this room ' +
           'carries the same labels. The north door stays shut.</div>';
  } else {
    const byLabel = new Map();
    opts.forEach((o, i) => {
      if (!byLabel.has(o.label)) byLabel.set(o.label, []);
      byLabel.get(o.label).push(i);
    });
    for (const [label, idx] of byLabel){
      html += '<div class="cgh">' + esc(label) + '</div><ul class="clist">';
      for (const i of idx){
        const o = opts[i];
        const on = G.next && G.next.key === o.key && G.next.value === o.value;
        html += '<li><button class="crow' + (on ? ' on' : '') + '" data-i="' + i + '">' +
                esc(o.value) + '<em>' + o.n + (o.n === 1 ? ' piece' : ' pieces') +
                (on ? ' · the north door is open on this' : '') + '</em></button></li>';
      }
      html += '</ul>';
    }
  }
  if (G.next)
    html = '<button class="shutbtn">✕ shut the north door — ' +
           esc(G.next.label + ': ' + G.next.value) + '</button>' + html;
  rbody.innerHTML = html;
  rbody.onclick = e => {
    if (e.target.closest('.shutbtn')){ closeGallery(en.depth); return; }
    const b = e.target.closest('.crow');
    if (b) openFilter(en.depth, G.opts[+b.dataset.i]);
  };
  hintRow(G.next ? 'pick another, or shut the door to collapse what is beyond'
                 : 'pick one and the door north opens onto it');
}

function renderReading(en){
  rtitle.textContent = en.title;
  rmeta.innerHTML = '';
  rbody.className = '';
  rbody.innerHTML = '';
  rbody.onclick = null;
  rbody.scrollTop = 0;
  readerEl.classList.remove('wide', 'full');
  if (en.filters){ showFilters(en); return; }
  if (en.shelfList){ showShelfList(en); return; }
  if (en.file || en.files){ rmeta.innerHTML = tagsOf(en); showDoc(en); return; }
  if (en.image){ showPicture(en); return; }
  rbody.textContent = en.body || '';
  if (en.link){                                  // a readable that is really a way out
    const a = document.createElement('a');
    a.className = 'golink';
    a.href = en.link;
    a.textContent = en.linkText || 'open ↗';
    rbody.appendChild(a);
  }
  hintRow(isTouch ? 'tap ✕ to close' : 'E / right-click / Esc closes · scroll to read');
}
function openReading(en, push){
  if (push && reading) readerStack.push(reading);
  else if (!push) readerStack.length = 0;
  reading = en;
  renderReading(en);
  rbackBtn.style.display = readerStack.length ? 'block' : 'none';
  rback.style.display = 'block';
  readerEl.style.display = 'block';
  aimtip.style.display = 'none';
  if (locked()){                       // you need the cursor back to click around in here
    relockAfterRead = true;
    intentionalUnlock = true;
    document.exitPointerLock();
  }
}
function closeReading(){
  reading = null;
  readerStack.length = 0;
  rbody.innerHTML = '';
  rbody.className = '';
  rback.style.display = 'none';
  readerEl.style.display = 'none';
  readerEl.classList.remove('wide', 'full');
  rbackBtn.style.display = 'none';
  if (relockAfterRead){ relockAfterRead = false; tryLock(); }
}
rbackBtn.addEventListener('click', () => {
  const prev = readerStack.pop();
  if (!prev) return;
  reading = prev;
  renderReading(prev);
  rbackBtn.style.display = readerStack.length ? 'block' : 'none';
});
document.getElementById('rclose').addEventListener('click', closeReading);
rback.addEventListener('click', closeReading);

/* ============ interact: read / grab / place ============ */
let cheesed = false;
function grabItem(item){
  held = item;
  for (const m of item.meshes){
    const i = occluders.indexOf(m);
    if (i > -1) occluders.splice(i, 1);      // your own hands should not block your aim
  }
  carryPos.copy(item.group.position);         // it glides up into your hands
  if (item.id === 'cheese' && !cheesed){
    cheesed = true;
    showToast('Ew. You actually picked up the mystery cheese. That is SO gross.');
  }
}
function placeHeld(hit){
  const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  if (n.y < 0.7){ showToast("It won't balance there."); return; }
  held.group.position.set(hit.point.x, hit.point.y + 0.002, hit.point.z);
  held.group.rotation.set(0, player.yaw + (Math.random() - 0.5) * 0.8, 0);
  occluders.push(...held.meshes);
  held = null;
}
function dropHeld(){
  if (!held) return;
  const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
  let px = player.x + fx * 0.9, pz = player.z + fz * 0.9;
  if (horizBlocked(px, pz, player.y)){ px = player.x; pz = player.z; }
  let gy = 0;
  for (const c of aabbs){
    if (!c.land) continue;
    if (c.y1 <= player.y + 1.1 && c.y1 > gy && overlapA(c, px, pz, 0.05)) gy = c.y1;
  }
  held.group.position.set(px, gy + 0.002, pz);
  held.group.rotation.set(0, Math.random() * Math.PI * 2, 0);
  occluders.push(...held.meshes);
  held = null;
}
function interact(){
  if (menuOpen()) return;
  if (reading){ closeReading(); return; }
  const t = aimedTarget();
  if (t && t.kind === 'read'){ openReading(t.entry); return; }
  if (!held){
    if (t && t.kind === 'item') grabItem(t.item);
    return;
  }
  if (t && t.kind === 'surface'){ placeHeld(t.hit); return; }
  if (t && t.kind === 'item'){ showToast('Hands full — place it somewhere, or Q to drop.'); return; }
  dropHeld();                                  // aimed at a wall or nothing: just set it down
}
addEventListener('wheel', e => {
  if (reading && !readerEl.contains(e.target)) rbody.scrollTop += e.deltaY;
}, {passive:true});

/* ============ player + physics ============ */
const player = {x:0, z:5.2, y:0, vy:0, yaw:0, pitch:0, r:0.32};
const PH = 1.7, STEPUP = 0.56, GRAV = 17, JUMPV = 5.6;
let onGround = true, jumpQ = 0, camYs = 0;
const keys = {};
const PITCH_MAX = Math.PI/2 - 0.0005;             // straight down at your shoes, straight up at the lamp
const clampPitch = p => Math.max(-PITCH_MAX, Math.min(PITCH_MAX, p));

function overlapA(c, x, z, r){
  return x > c.x0 - r && x < c.x1 + r && z > c.z0 - r && z < c.z1 + r;
}
function segD2(px, pz, s){
  const dx = s.bx - s.ax, dz = s.bz - s.az;
  const l2 = dx*dx + dz*dz;
  let t = l2 ? ((px - s.ax)*dx + (pz - s.az)*dz) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = s.ax + dx*t - px, cz = s.az + dz*t - pz;
  return cx*cx + cz*cz;
}
function horizBlocked(x, z, y){
  const r = player.r, top = y + PH;
  for (const c of aabbs){
    if (c.y0 >= top || c.y1 <= y + STEPUP) continue;   // step over low things, walk under high ones
    if (overlapA(c, x, z, r)) return true;
  }
  for (const s of segs){
    if (s.y0 >= top || s.y1 <= y + STEPUP) continue;
    const rr = r + s.ht;
    if (segD2(x, z, s) < rr*rr) return true;
  }
  return false;
}
const SHAFT_N = [Math.PI/6, Math.PI/2, Math.PI*5/6].map(a => [Math.cos(a), Math.sin(a)]);
function galleryAt(z){               // which gallery you are standing in, if any
  const d = Math.round((HEX_Z - z) / GAL_DZ);
  return (d >= 0 && d < galleries.length) ? galleries[d] : null;
}
function inShaft(x, z){              // inside the hexagonal shaft hole: there is no floor
  const g = galleryAt(z);
  if (!g) return false;
  const pz = z - g.cz;
  for (const n of SHAFT_N)
    if (Math.abs(x * n[0] + pz * n[1]) > 1.87) return false;
  return true;
}
function groundAt(x, z, y){
  let g = inShaft(x, z) ? -999 : 0;
  for (const c of aabbs){
    if (!c.land) continue;
    if (c.y1 > y + STEPUP || c.y1 <= g) continue;
    if (overlapA(c, x, z, player.r)) g = c.y1;
  }
  return g;
}

/* control state */
let everLocked = false, unlockAt = 0, relockT = 0;
let canLock = true, isTouch = false, dragging = false, lx = 0, ly = 0;
const locked = () => document.pointerLockElement === canvas;

addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (reading){
    if (e.code === 'KeyE' && !e.repeat) closeReading();
    return;
  }
  keys[e.code] = true;
  if (e.code === 'KeyE' && !e.repeat) interact();
  if (e.code === 'KeyQ' && !e.repeat) dropHeld();

});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mvx = 0; mvy = 0; dragging = false; });

/* pointer lock (with smooth raw input where supported, and a cooldown-aware retry) */
function lockFailed(){
  if (everLocked){ showToast('The browser needs a second before recapturing — click again.'); return; }
  if (!canLock) return;
  canLock = false;
  showToast('Mouse capture is blocked here, so drag to look around instead.');
}
function tryLock(isRetry){
  if (isTouch || !canLock || locked()) return;
  let p;
  try { p = canvas.requestPointerLock({unadjustedMovement:true}); }
  catch (err){
    try { p = canvas.requestPointerLock(); }
    catch (e2){ lockFailed(); return; }
  }
  if (p && p.catch) p.catch(() => {
    if (!everLocked){ lockFailed(); return; }
    if (!isRetry){
      clearTimeout(relockT);
      relockT = setTimeout(() => { if (!locked() && !menuOpen() && !reading) tryLock(true); }, 1350);
    } else showToast('click once more to recapture the mouse');
  });
}
canvas.addEventListener('click', () => {
  if (locked()){ rightClickInteract(); return; }
  if (menuOpen()) closeMenu();
  tryLock();
});
document.addEventListener('pointerlockerror', lockFailed);

/* right-click / two-finger tap = interact (deduped across the event paths) */
let lastInteract = 0;
function rightClickInteract(){
  const now = performance.now();
  if (now - lastInteract < 150) return;
  lastInteract = now;
  interact();
}
canvas.addEventListener('mousedown', e => {
  if (e.button === 2){ rightClickInteract(); return; }
  dragging = true; lx = e.clientX; ly = e.clientY;
});
addEventListener('mousemove', e => {
  if (locked()){
    if (reading || menuOpen()) return;
    const mx = Math.max(-60, Math.min(60, e.movementX || 0));
    const my = Math.max(-60, Math.min(60, e.movementY || 0));
    player.yaw   -= mx * 0.0032 * sens;
    player.pitch  = clampPitch(player.pitch - my * 0.0032 * sens);
    return;
  }
  if (!dragging || menuOpen() || reading) return;
  player.yaw   -= (e.clientX - lx) * 0.0052 * sens;
  player.pitch  = clampPitch(player.pitch - (e.clientY - ly) * 0.0052 * sens);
  lx = e.clientX; ly = e.clientY;
});
addEventListener('mouseup', e => {
  dragging = false;
  if (e.button === 2) rightClickInteract();
});
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  rightClickInteract();
});

/* touch: left half = walk stick, right half = look; on-screen JUMP / USE buttons */
const stickEl = document.getElementById('stick'), knob = document.getElementById('knob');
const mbtns = document.getElementById('mbtns');
let moveId = null, lookId = null, mox = 0, moy = 0, mvx = 0, mvy = 0, llx = 0, lly = 0;
if (matchMedia('(pointer:coarse)').matches) mbtns.style.display = 'flex';
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  isTouch = true;
  mbtns.style.display = 'flex';
  for (const t of e.changedTouches){
    if (t.clientX < innerWidth/2 && moveId === null){
      moveId = t.identifier; mox = t.clientX; moy = t.clientY; mvx = 0; mvy = 0;
      stickEl.style.display = 'block';
      stickEl.style.left = (mox - 48) + 'px'; stickEl.style.top = (moy - 48) + 'px';
      knob.style.transform = 'translate(0,0)';
    } else if (lookId === null){
      lookId = t.identifier; llx = t.clientX; lly = t.clientY;
    }
  }
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches){
    if (t.identifier === moveId){
      const dx = t.clientX - mox, dy = t.clientY - moy;
      const m = Math.hypot(dx, dy), cap = 44, k = m > cap ? cap/m : 1;
      mvx = dx*k/cap; mvy = dy*k/cap;
      knob.style.transform = 'translate(' + dx*k + 'px,' + dy*k + 'px)';
    } else if (t.identifier === lookId){
      player.yaw   -= (t.clientX - llx) * 0.006 * sens;
      player.pitch  = clampPitch(player.pitch - (t.clientY - lly) * 0.006 * sens);
      llx = t.clientX; lly = t.clientY;
    }
  }
}, {passive:false});
function endTouch(e){
  for (const t of e.changedTouches){
    if (t.identifier === moveId){ moveId = null; mvx = mvy = 0; stickEl.style.display = 'none'; }
    if (t.identifier === lookId)  lookId = null;
  }
}
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);
const btnJump = document.getElementById('btnJump'), btnUse = document.getElementById('btnUse');
function pressJump(e){ e.preventDefault(); isTouch = true; jumpQ = performance.now(); }
function pressUse(e){ e.preventDefault(); isTouch = true; interact(); }
btnJump.addEventListener('touchstart', pressJump, {passive:false});
btnUse.addEventListener('touchstart', pressUse, {passive:false});
btnJump.addEventListener('mousedown', e => { e.preventDefault(); jumpQ = performance.now(); });
btnUse.addEventListener('mousedown', e => { e.preventDefault(); interact(); });

/* ---- the teleporter: every room in the house, plus every gallery you have
       opened so far, rebuilt each time the menu appears ---- */
const TP_ROOMS = [
  ['The Atrium',   0,  5.2,  0],
  ['Writings',   -11,  3.0,  Math.PI/2],
  ['Ideas',       11,  3.0, -Math.PI/2],
  ['About Me',  -4.5, 10.5,  Math.PI],
  ['Honors',     4.5, 10.5,  Math.PI],
  ['Workshop', -19.5,  3.0, -Math.PI/2]
];
function teleport(x, z, yaw){
  player.x = x; player.z = z; player.y = 0; player.vy = 0;
  player.yaw = yaw; player.pitch = 0; camYs = 0;
  held = null;
  closeMenu(); tryLock();
  showToast('→ ' + region(x, z));
}
function buildTeleport(){
  const el = document.getElementById('tp');
  el.innerHTML = '';
  const add = (name, x, z, yaw) => {
    const b = document.createElement('button');
    b.className = 'modebtn';
    b.textContent = name;
    b.addEventListener('click', () => teleport(x, z, yaw));
    el.appendChild(b);
  };
  for (const r of TP_ROOMS) add(r[0], r[1], r[2], r[3]);
  galleries.forEach((g, i) => add(i ? 'ℵ ' + g.chain.map(c => c.value).join(' · ') : 'The Library',
                                  0, g.cz + 4.6, 0));
}
document.getElementById('resume').addEventListener('click', () => { closeMenu(); tryLock(); });

document.addEventListener('pointerlockchange', () => {
  if (locked()){ everLocked = true; closeMenu(); }
  else if (everLocked && !isTouch){
    unlockAt = performance.now();
    for (const k in keys) keys[k] = false;
    if (intentionalUnlock){ intentionalUnlock = false; return; }   // we let go on purpose, to read
    if (reading){ relockAfterRead = false; closeReading(); showToast('click anywhere to keep exploring'); }
    else openMenu();
  }
});
addEventListener('keydown', e => {
  if (e.code !== 'Escape' || locked()) return;
  if (reading){ closeReading(); return; }
  if (performance.now() - unlockAt < 400) return;
  menuOpen() ? closeMenu() : openMenu();
});

/* ============ regions ============ */
function region(x, z){
  if (z < -6){
    const g = galleryAt(z);
    return g ? g.name : 'The Library of Babel';
  }
  if (z < -2)  return 'The Corridor';
  if (z < 8){
    if (x < -16) return 'The Workshop';
    if (x < -9) return 'Writings';
    if (x >  9) return 'The Onion Room';
    return 'The Atrium';
  }
  return x < 0 ? 'About Me' : 'Honors & Awards';
}
const toast = document.getElementById('toast');
let toastTimer = 0;
function showToast(t){
  toast.textContent = t; toast.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.style.opacity = 0, 2800);
}
setTimeout(() => showToast('v18 · click to look around · WASD walks · the library is north'), 700);

/* ============ main loop ============ */
const clock = new THREE.Clock();
const _look = new THREE.Vector3();
const _hw = new THREE.Vector3();
const _eul = new THREE.Euler(0, 0, 0, 'YXZ');
/* 2-point holds the world's verticals parallel with a shift lens; 3-point is an
   ordinary lens that really tilts. The menu switches between them. */
let vertKeep = 0.55;

const xh = document.getElementById('xh');
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const inMenu = paused();

  let f = 0, s = 0;
  if (!inMenu){
    if (keys.KeyW || keys.ArrowUp)   f += 1;
    if (keys.KeyS || keys.ArrowDown) f -= 1;
    if (keys.KeyA) s -= 1;
    if (keys.KeyD) s += 1;
    if (keys.ArrowLeft)  player.yaw += 2.3 * dt;
    if (keys.ArrowRight) player.yaw -= 2.3 * dt;
    f += -mvy; s += mvx;
  }
  const L = Math.hypot(f, s);
  if (L > 1){ f /= L; s /= L; }

  const sprintKey = keys.ShiftLeft || keys.ShiftRight;
  const sp  = sprintKey ? 5.2 : 3.4;
  /* forward is literally where the crosshair points, flattened to the floor;
     right is forward turned 90°. W therefore always runs down the crosshair. */
  const fwdX = -Math.sin(player.yaw), fwdZ = -Math.cos(player.yaw);
  const rgtX =  Math.cos(player.yaw), rgtZ = -Math.sin(player.yaw);
  const dx = (f * fwdX + s * rgtX) * sp * dt;
  const dz = (f * fwdZ + s * rgtZ) * sp * dt;
  /* Resolve in short sub-steps. Collision is settled one axis at a time, so a
     single long step that clips a wall cancels that whole axis and throws you
     90° off course — which is why sprinting used to veer away from the
     crosshair far more than walking did. Small steps slide smoothly instead. */
  const steps = Math.min(8, Math.max(1, Math.ceil(Math.hypot(dx, dz) / 0.05)));
  const stepX = dx / steps, stepZ = dz / steps;
  for (let i = 0; i < steps; i++){
    if (!horizBlocked(player.x + stepX, player.z, player.y)) player.x += stepX;
    if (!horizBlocked(player.x, player.z + stepZ, player.y)) player.z += stepZ;
  }

  /* vertical: gravity, head bonks, landing on whatever is under you */
  player.vy -= GRAV * dt;
  let ny = player.y + player.vy * dt;
  if (player.vy > 0){
    let lim = Infinity;
    for (const c of aabbs){
      if (c.y0 >= player.y + PH - 0.06 && c.y0 < lim && overlapA(c, player.x, player.z, player.r)) lim = c.y0;
    }
    if (ny + PH > lim){ ny = lim - PH; player.vy = 0; }
  }
  const gnd = groundAt(player.x, player.z, player.y);
  if (player.vy <= 0 && ny <= gnd){ ny = gnd; player.vy = 0; onGround = true; }
  else onGround = false;
  player.y = ny;
  if (player.y < -26){                 // fell down the library shaft
    const g = galleryAt(player.z) || galleries[0];
    player.x = 0; player.z = g.cz + 4.4; player.y = 0; player.vy = 0; camYs = 0;
    showToast('The Library is a sphere. You are not. (respawned)');
  }
  if (onGround && !inMenu && (keys.Space || performance.now() - jumpQ < 200)){
    player.vy = JUMPV; onGround = false; jumpQ = 0;
  }
  camYs += (player.y - camYs) * Math.min(1, dt * 14);
  if (Math.abs(player.y - camYs) < 0.002) camYs = player.y;

  /* dynamic FOV: widens slightly while sprinting */
  const moving = (f !== 0 || s !== 0);
  const sprinting = sprintKey && moving;
  fovCurrent += (baseFov * (sprinting ? 1.06 : 1) - fovCurrent) * Math.min(1, dt * 9);
  /* the slider is HORIZONTAL field of view, the way games quote it (Minecraft's
     default 70 is horizontal). three.js wants the vertical angle, so convert
     through the aspect ratio — setting 70 straight onto camera.fov renders about
     100° across on a 16:9 window, and that is what made pitching look splayed. */
  camera.fov = 2 * Math.atan(Math.tan(fovCurrent * Math.PI / 360) / camera.aspect) * 180 / Math.PI;

  /* first-person camera, plain and Minecraft-honest: yaw about world up, then pitch,
     built as a quaternion so the horizon can never roll. No shift lens — the camera
     really tilts, so you can look at your own feet and straight up at the ceiling.
     The screen centre is therefore exactly the look direction, which is what the
     crosshair and the aim ray both rely on. */
  const cp = Math.cos(player.pitch);
  _look.set(-Math.sin(player.yaw) * cp, Math.sin(player.pitch), -Math.cos(player.yaw) * cp);
  camera.position.set(player.x, 1.62 + camYs, player.z);
  /* 2-point uses a shift lens, which holds the world's verticals dead straight on
     screen; every other mode lets the camera really tilt, like your eye does. */
  const shift = vertKeep > 0.001 ? vertKeep * Math.tanh(player.pitch / vertKeep) : 0;
  _eul.set(player.pitch - shift, player.yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(_eul);
  camera.updateProjectionMatrix();
  if (shift){
    camera.projectionMatrix.elements[9] = Math.tan(shift) / Math.tan(camera.fov * Math.PI / 360);
    camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  }

  /* the carried item floats out in front of you, with a little lag */
  if (held){
    _carryT.copy(camera.position).addScaledVector(_look, 0.85);
    _carryT.y -= 0.34;
    carryPos.lerp(_carryT, Math.min(1, dt * 12));
    held.group.position.copy(carryPos);
    held.group.rotation.set(0, player.yaw, 0);
  }

  /* the gold solids turn and drift, and the glyph above each stays upright */
  const now = performance.now() / 1000;
  for (const sp of spinners){
    sp.o.rotation.y += sp.s * dt;
    sp.o.rotation.x += sp.s * 0.35 * dt;
    sp.o.position.y = sp.y0 + Math.sin(now * 0.8) * 0.05;
    if (sp.b){ sp.b.rotation.x = -sp.o.rotation.x; sp.b.rotation.y = -sp.o.rotation.y; }
  }

  /* candlelight: every flame flickers on its own phase, and its halo faces you */
  for (const f of flames){
    const t = now * 8 + f.ph;
    const k = 0.82 + 0.18 * Math.sin(t) + 0.09 * Math.sin(t * 2.7 + 1.3);
    f.body.scale.set(0.85 + k * 0.2, k, 0.85 + k * 0.2);
    f.halo.scale.setScalar(0.88 + k * 0.22);
    f.halo.getWorldPosition(_hw);
    f.halo.rotation.y = Math.atan2(camera.position.x - _hw.x, camera.position.z - _hw.z)
                        - (f.halo.parent ? f.halo.parent.rotation.y : 0);
  }

  /* the books, and the mathematics, go on falling whether anyone is there or not */
  for (const b of fallers){
    const p = b.g.position;
    p.y -= b.v * dt;
    if (b.glyph){
      b.g.rotation.y = Math.atan2(camera.position.x - p.x, camera.position.z - p.z);
      const k = b.s0 * (0.86 + 0.14 * Math.sin(now * 1.7 + b.ph));
      b.g.scale.set(k, k, 1);
    } else {
      b.g.rotation.x += b.sx * dt; b.g.rotation.y += b.sy * dt; b.g.rotation.z += b.sz * dt;
    }
    if (p.y < FALL_BOTTOM){
      p.y = FALL_TOP;
      const a = Math.random() * Math.PI * 2, r = (b.glyph ? 0 : 0.35) + Math.random() * 1.2;
      p.x = Math.cos(a) * r; p.z = b.cz + Math.sin(a) * r;
    }
  }

  xh.style.display = inMenu ? 'none' : 'block';
  camera.updateMatrixWorld();
  updateAim();

  renderer.render(scene, camera);
}

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
tick();
})();
</script>
</body>
</html>
