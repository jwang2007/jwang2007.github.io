<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>my house</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:
      repeating-linear-gradient(180deg, transparent 0 26px, rgba(110,150,220,.16) 26px 27px),
      #fcfcf9;
    font-family:"Comic Sans MS","Comic Neue","Segoe Print","Bradley Hand",cursive;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #c{position:fixed;inset:0;display:block;touch-action:none}
  .panel{position:fixed;z-index:5;background:#fff;border:2.5px solid #141414;border-radius:10px;
         box-shadow:3px 3px 0 #141414;padding:7px 12px;color:#141414;line-height:1.45}
  #loc{top:12px;right:12px;font-size:14px;max-width:46vw;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}
  #toast{bottom:64px;left:50%;transform:translateX(-50%);font-size:15px;opacity:0;
         transition:opacity .35s;pointer-events:none;white-space:nowrap;z-index:6}
  #stick{position:fixed;z-index:6;width:96px;height:96px;border:2.5px dashed #141414;border-radius:50%;
         display:none;pointer-events:none;background:rgba(255,255,255,.55)}
  #knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;
        border:2.5px solid #141414;border-radius:50%;background:#fff;box-shadow:2px 2px 0 #141414}
  #xh{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;
      pointer-events:none;z-index:4;opacity:.85}
  #xh::before,#xh::after{content:"";position:absolute;background:#141414}
  #xh::before{left:6px;top:0;width:2px;height:14px}
  #xh::after{left:0;top:6px;width:14px;height:2px}
  #aimtip{position:fixed;left:50%;top:calc(50% + 20px);transform:translateX(-50%);display:none;
          font-size:12.5px;padding:3px 9px;pointer-events:none;z-index:4;white-space:nowrap;
          max-width:70vw;overflow:hidden;text-overflow:ellipsis}
  #mbtns{position:fixed;right:14px;bottom:24px;display:none;flex-direction:column;gap:12px;z-index:6}
  .mbtn{width:64px;height:64px;border-radius:50%;border:2.5px solid #141414;background:rgba(255,255,255,.92);
        color:#141414;font-family:inherit;font-weight:700;font-size:13px;box-shadow:2px 2px 0 #141414;
        touch-action:none;user-select:none}
  .mbtn:active{transform:translate(2px,2px);box-shadow:none}
  #settings{top:50%;left:50%;transform:translate(-50%,-50%);display:none;width:min(340px,88vw);
            text-align:center;font-size:15px;padding:16px 20px;z-index:8;max-height:86vh;overflow-y:auto}
  #settings h2{margin:0 0 4px;font-size:19px;letter-spacing:1px}
  .srow{margin:12px 0 4px;text-align:left}
  .srow label{display:block;margin-bottom:5px;font-weight:700}
  #ctl{font-size:12.5px;line-height:1.7;font-weight:400}
  #fov,#sens{width:100%;accent-color:#141414}
  #tp{display:flex;flex-wrap:wrap;gap:5px}
  #tp .modebtn{margin:0;font-size:12px;padding:5px 9px}
  .modebtn{font-family:inherit;font-size:13px;padding:6px 10px;margin:2px 4px 2px 0;border:2.5px solid #141414;
           border-radius:8px;background:#fff;color:#141414;cursor:pointer;box-shadow:2px 2px 0 #141414}
  .modebtn.on{background:#141414;color:#fff}
  #resume{font-family:inherit;font-weight:700;font-size:15px;margin-top:12px;padding:8px 14px;width:100%;
          border:2.5px solid #141414;border-radius:8px;background:#fff;color:#141414;cursor:pointer;
          box-shadow:2px 2px 0 #141414}
  #resume:active,.modebtn:active{transform:translate(2px,2px);box-shadow:none}
  #rback{position:fixed;inset:0;z-index:8;display:none;background:rgba(252,252,249,.6)}

  /* ---- the reading overlay: text, documents, pictures, shelf lists, filters ---- */
  #reader{top:50%;left:50%;transform:translate(-50%,-50%);display:none;width:min(560px,92vw);
          z-index:9;padding:14px 18px 10px}
  #reader.wide{width:min(1500px,96vw)}
  /* documents get the whole window — the PDF is vector, so more room is literally
     more resolution */
  #reader.full{width:100vw;height:100vh;max-width:none;top:0;left:0;transform:none;
               border-radius:0;border-width:0;box-shadow:none;padding:10px 12px 8px;
               display:flex;flex-direction:column}
  #reader.full #rtitle{margin:2px 150px 4px 4px;font-size:17px}
  #reader.full #rmeta{margin-bottom:6px}
  #reader.full #rbody.doc{flex:1;height:auto;max-height:none}
  #reader.full .rframe{border-width:2px;border-radius:4px}
  #reader.full #rhint{margin-top:6px}
  #rclose,#rbackbtn{position:absolute;top:8px;border:2.5px solid #141414;border-radius:8px;background:#fff;
          font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:2px 2px 0 #141414;
          height:32px;line-height:1;color:#141414;padding:0}
  #rclose{right:10px;width:32px}
  #rbackbtn{right:48px;display:none;padding:0 10px}
  #rclose:active,#rbackbtn:active{transform:translate(2px,2px);box-shadow:none}
  #rtitle{margin:2px 88px 6px 0;font-size:19px;line-height:1.25}
  #rmeta{display:flex;flex-wrap:wrap;gap:5px;font-size:11.5px;margin-bottom:9px}
  #rmeta:empty{display:none}
  .tag{border:2px solid #141414;border-radius:999px;padding:1px 9px;background:#fff}
  #rbody{white-space:pre-wrap;font-size:14.5px;line-height:1.55;max-height:56vh;overflow-y:auto;
         padding-right:6px;overscroll-behavior:contain}
  #rbody.doc{white-space:normal;height:82vh;max-height:82vh;padding:0;overflow:hidden;
             display:flex;flex-direction:column}
  .rframe{flex:1;min-height:0;border:2.5px solid #141414;border-radius:8px;overflow:auto;background:#fff}
  .rframe iframe{width:100%;height:100%;border:0;display:block}
  #rbody.pic{white-space:normal;text-align:center}
  #rbody.pic img{max-width:100%;max-height:44vh;border:2.5px solid #141414;border-radius:8px}
  #rbody.pic .cap{white-space:pre-wrap;text-align:left;margin-top:10px}
  #rbody.cat{white-space:normal;max-height:62vh}
  .cgh{margin:13px 0 6px;font-size:12.5px;letter-spacing:1.5px;opacity:.55;font-weight:700}
  .cgh:first-child{margin-top:0}
  .clist{list-style:none;margin:0;padding:0}
  .crow{display:block;width:100%;text-align:left;font-family:inherit;font-size:14px;background:#fff;
        border:2.5px solid #141414;border-radius:8px;box-shadow:2px 2px 0 #141414;padding:6px 10px;
        margin-bottom:7px;cursor:pointer;color:#141414;line-height:1.3}
  .crow em{display:block;font-style:normal;font-size:11px;opacity:.55;margin-top:2px}
  .crow:active{transform:translate(2px,2px);box-shadow:none}
  .crow.on{background:#141414;color:#fff}
  .crow.on em{opacity:.7}
  /* the shelf list, laid out like a desktop of files */
  #rbody.desk{white-space:normal;max-height:62vh;padding:4px}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:14px}
  .dfile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 6px 8px;
         background:transparent;border:2.5px solid transparent;border-radius:10px;cursor:pointer;
         font-family:inherit;color:#141414;text-align:center}
  .dfile:hover{border-color:#141414;background:#fff}
  .dfile:active{transform:translate(1px,1px)}
  .dthumb{position:relative;width:104px;height:134px;background:#fff;border:2.5px solid #141414;
          border-radius:3px;box-shadow:2px 2px 0 #141414;flex:none;overflow:hidden}
  .dthumb iframe{position:absolute;top:0;left:0;width:832px;height:1072px;border:0;
                 transform:scale(0.125);transform-origin:0 0;pointer-events:none;background:#fff}
  .dthumb .dcode{position:absolute;top:0;left:0;width:832px;margin:0;padding:34px;
                 font-family:ui-monospace,Menlo,monospace;font-size:15px;line-height:1.45;
                 white-space:pre;transform:scale(0.125);transform-origin:0 0;pointer-events:none}
  .dthumb[data-stack]::after{content:"";position:absolute;right:-7px;bottom:-7px;width:22px;height:26px;
          background:#fff;border:2.5px solid #141414;border-radius:2px;z-index:-1}
  .dname{font-size:11.5px;line-height:1.25;word-break:break-word}
  .shutbtn{display:block;width:100%;font-family:inherit;font-size:13px;padding:7px 10px;
           margin-bottom:12px;border:2.5px solid #141414;border-radius:8px;background:#8f3a30;
           color:#fff;cursor:pointer;box-shadow:2px 2px 0 #141414;font-weight:700}
  .shutbtn:active{transform:translate(2px,2px);box-shadow:none}
  .rtabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .rtab{font-family:inherit;font-size:12.5px;padding:4px 9px;border:2.5px solid #141414;border-radius:8px;
        background:#fff;cursor:pointer;color:#141414;box-shadow:2px 2px 0 #141414}
  .rtab.on{background:#141414;color:#fff}
  .rtab:active{transform:translate(2px,2px);box-shadow:none}
  .golink{display:inline-block;margin-top:16px;font-family:inherit;font-weight:700;font-size:14.5px;
          text-decoration:none;color:#141414;background:#f3d95c;border:2.5px solid #141414;
          border-radius:8px;padding:8px 15px;box-shadow:2px 2px 0 #141414}
  .golink:active{transform:translate(2px,2px);box-shadow:none}
  .warn{font-size:11.5px;border:2px dashed #141414;border-radius:8px;padding:5px 9px;margin-bottom:8px;opacity:.75}
  pre.code{margin:0;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
           white-space:pre;line-height:1.45}
  #rhint{margin-top:9px;font-size:11.5px;opacity:.65;display:flex;justify-content:space-between;
         gap:12px;align-items:center}
  #rhint a{color:#141414;font-weight:700}
  #ver{position:fixed;left:10px;bottom:6px;font-size:11px;opacity:.45;z-index:3;color:#141414;pointer-events:none}
  @media (max-width:720px){ #rbody.doc{height:68vh;max-height:68vh} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ver">v18</div>
<div id="toast" class="panel"></div>
<div id="stick"><div id="knob"></div></div>
<div id="xh"></div>
<div id="aimtip" class="panel"></div>
<div id="mbtns">
  <button id="btnUse" class="mbtn">USE</button>
  <button id="btnJump" class="mbtn">JUMP</button>
</div>
<div id="rback"></div>
<div id="reader" class="panel">
  <button id="rbackbtn">&#8249; back</button>
  <button id="rclose">&#10005;</button>
  <h2 id="rtitle"></h2>
  <div id="rmeta"></div>
  <div id="rbody"></div>
  <div id="rhint"></div>
</div>
<div id="settings" class="panel">
  <h2>SETTINGS <span style="font-size:12px;opacity:.5">v18</span></h2>
  <div class="srow">
    <label>Field of view: <span id="fovVal">110</span>&deg; across</label>
    <input id="fov" type="range" min="45" max="130" step="1" value="110">
  </div>
  <div class="srow">
    <label>Look sensitivity: <span id="sensVal">1.00</span>&times;</label>
    <input id="sens" type="range" min="0.2" max="3" step="0.05" value="1">
  </div>
  <div class="srow">
    <label>Perspective</label>
    <button class="modebtn on" data-vert="0.55">2-point</button>
    <button class="modebtn" data-vert="0">3-point</button>
  </div>
  <div class="srow">
    <label>Travel</label>
    <div id="tp"></div>
  </div>
  <div class="srow">
    <label>Controls</label>
    <div id="ctl">walk <b>WASD</b> &middot; jump <b>SPACE</b> &middot; sprint <b>SHIFT</b><br>
      grab / read / place <b>E</b> or <b>click</b> &middot; drop <b>Q</b></div>
  </div>
  <button id="resume">BACK TO THE GAME</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============ renderer / scene ============ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfcfcf9);     // the paper is part of the world now
scene.fog = new THREE.Fog(0xfcfcf9, 12, 58);      // far lines fade like light pencil
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 150);
camera.rotation.order = 'YXZ';

const INK = 0x141414;
function flatMat(c){ return new THREE.MeshBasicMaterial({color:c, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1}); }

/* ---- procedural grain. Everything here is still flat-shaded ink-on-paper; these
       only break up the big surfaces so the library reads as old stone and oak
       instead of coloured card. ---- */
function makeTex(draw, rep){
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  draw(c.getContext('2d'), 256);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rep, rep);
  t.anisotropy = 4;
  return t;
}
const stoneTex = makeTex((x, S) => {          // ashlar courses: cut blocks, not spots
  x.fillStyle = '#fff'; x.fillRect(0, 0, S, S);
  const rows = 6, h = S / rows;
  for (let r = 0; r < rows; r++){
    const off = (r % 2) * h * 1.1;            // running bond
    for (let c = -1; c < 5; c++){
      const w = S / 4, bx = off + c * w, by = r * h;
      const g = (232 + Math.random() * 23) | 0;
      x.fillStyle = 'rgb(' + g + ',' + g + ',' + g + ')';
      x.fillRect(bx + 1.4, by + 1.4, w - 2.8, h - 2.8);
    }
    x.strokeStyle = 'rgba(150,150,150,0.55)'; x.lineWidth = 1.6;
    x.beginPath(); x.moveTo(0, r * h); x.lineTo(S, r * h); x.stroke();
  }
  for (let i = 0; i < 260; i++){              // a little pitting in the stone
    const g = (214 + Math.random() * 30) | 0;
    x.fillStyle = 'rgba(' + g + ',' + g + ',' + g + ',0.5)';
    x.beginPath(); x.arc(Math.random() * S, Math.random() * S, 0.8 + Math.random() * 2, 0, 6.284); x.fill();
  }
}, 2);
const woodTex = makeTex((x, S) => {                        // long oak grain
  x.fillStyle = '#fff'; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 90; i++){
    x.strokeStyle = 'rgba(96,70,44,' + (0.05 + Math.random() * 0.16).toFixed(3) + ')';
    x.lineWidth = 0.5 + Math.random() * 1.8;
    x.beginPath();
    const y0 = Math.random() * S;
    x.moveTo(0, y0);
    for (let px = 0; px <= S; px += 12)
      x.lineTo(px, y0 + Math.sin(px * 0.028 + i) * 3.4 + (Math.random() - 0.5) * 2);
    x.stroke();
  }
}, 2);
const flagTex = makeTex((x, S) => {                        // worn flagstones
  x.fillStyle = '#fff'; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 900; i++){
    const g = (222 + Math.random() * 33) | 0;
    x.fillStyle = 'rgba(' + g + ',' + g + ',' + g + ',0.32)';
    x.beginPath(); x.arc(Math.random() * S, Math.random() * S, 2 + Math.random() * 7, 0, 6.284); x.fill();
  }
  x.strokeStyle = 'rgba(105,105,105,0.40)'; x.lineWidth = 2;
  for (let i = 0; i <= 2; i++){
    const p = i * S / 2;
    x.beginPath(); x.moveTo(p, 0); x.lineTo(p, S); x.stroke();
    x.beginPath(); x.moveTo(0, p); x.lineTo(S, p); x.stroke();
  }
}, 1.6);
/* the house proper is a different building from the library: pale plaster and
   a warm plank floor, so crossing the corridor reads as leaving somewhere. */
const plasterTex = makeTex((x, S) => {
  x.fillStyle = '#fff'; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 900; i++){
    const g = (238 + Math.random() * 17) | 0;
    x.fillStyle = 'rgba(' + g + ',' + g + ',' + g + ',0.34)';
    x.beginPath(); x.arc(Math.random()*S, Math.random()*S, 3 + Math.random()*11, 0, 6.284); x.fill();
  }
}, 2);
const plankTex = makeTex((x, S) => {
  x.fillStyle = '#fff'; x.fillRect(0, 0, S, S);
  const rows = 5, h = S / rows;
  for (let r = 0; r < rows; r++){
    const g = (231 + Math.random() * 24) | 0;
    x.fillStyle = 'rgb(' + g + ',' + g + ',' + g + ')';
    x.fillRect(0, r * h + 1.2, S, h - 2.4);
    for (let i = 0; i < 26; i++){                       // grain along the plank
      x.strokeStyle = 'rgba(150,118,86,' + (0.05 + Math.random()*0.14).toFixed(3) + ')';
      x.lineWidth = 0.5 + Math.random() * 1.4;
      const y0 = r * h + 2 + Math.random() * (h - 4);
      x.beginPath(); x.moveTo(0, y0);
      for (let px = 0; px <= S; px += 18) x.lineTo(px, y0 + Math.sin(px * 0.03 + i) * 1.6);
      x.stroke();
    }
    x.strokeStyle = 'rgba(140,110,80,0.5)'; x.lineWidth = 1.4;
    x.beginPath(); x.moveTo(0, r * h); x.lineTo(S, r * h); x.stroke();
  }
}, 3);

function texMat(c, map){
  return new THREE.MeshBasicMaterial({color:c, map, polygonOffset:true,
                                      polygonOffsetFactor:1, polygonOffsetUnits:1});
}

/* ---- carved mathematics: gold glyphs cut into the stone ---- */
const GLYPH_FONT = '"Apple Symbols","Segoe UI Symbol","Times New Roman",Georgia,serif';
function makeGlyph(ch, w, color){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = color || '#d9b45e';
  x.font = '600 168px ' + GLYPH_FONT;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(ch, 128, 134);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  return new THREE.Mesh(new THREE.PlaneGeometry(w, w),
                        new THREE.MeshBasicMaterial({map:t, transparent:true}));
}
const GLYPHS = ['ℵ', '∞', '∑', '∫', 'π', '√', 'Ω', 'Φ', '∂'];
const meshMat   = flatMat(0xffffff);
const yellowMat = flatMat(0xf3d95c);
const PAL = {                       // chunky-cartoon prop colors (the walls stay white)
  red:    flatMat(0xe0705a),
  teal:   flatMat(0x5fb3a1),
  blue:   flatMat(0x6f9ceb),
  green:  flatMat(0x8db862),
  purple: flatMat(0xa88fd8),
  pink:   flatMat(0xe89bb4),
  orange: flatMat(0xe8994d),
  wood:   flatMat(0xcf9d63),
  dark:   flatMat(0xa9784a),
  cork:   flatMat(0xd8b98a),
  cream:  flatMat(0xf5ead3)
};
/* the library keeps its own warm, papery palette — ink, brick, ochre, olive,
   sand and plum. Nothing cyan: the gold spines have to be the brightest thing
   on the shelf. */
const LIB = {
  brick: flatMat(0xb4573f),
  ochre: flatMat(0xd9a441),
  olive: flatMat(0x7f8f5a),
  sand:  flatMat(0xe0c9a0),
  plum:  flatMat(0x9c7396),
  shelf: flatMat(0xc08a52),
  back:  flatMat(0xf3ead6),
  /* the room itself. Dark slate, so the shelves and the gold spines are the only
     bright things in it. Change these three hexes to retint the whole library. */
  wall:  texMat(0x53585f, stoneTex),
  floor: texMat(0x43474d, flagTex),
  ceil:  texMat(0x676d76, stoneTex),
  oak:     texMat(0x6b4a2f, woodTex),       // dark oak: the case, the big shelves, the railing
  oakDark: texMat(0x4e3421, woodTex),       // the recess behind the books
  oakLite: texMat(0x86603f, woodTex),       // catches the light: balusters, capitals
  door:    texMat(0x8f3a30, woodTex),       // oxblood, the same family as the rug
  doorDim: texMat(0x732d26, woodTex),
  iron:    flatMat(0x2f3238),
  brass:   flatMat(0xd9b45e),
  rugDeep: flatMat(0x8f4032),
  well:    texMat(0x2b2e34, stoneTex),       // the lining of the shaft
  wellEnd: flatMat(0x1d2025),
  wax:     flatMat(0xece0c4),                // candles
  flame:   flatMat(0xf0b93f)
};
/* the raised bands every bound book carries: the spine's own colour, darkened,
   the way the brass band sits against the gold of the real work */
function shade(hex, k){
  const c = v => Math.max(0, Math.min(255, Math.round(v * k)));
  return (c((hex >> 16) & 255) << 16) | (c((hex >> 8) & 255) << 8) | c(hex & 255);
}

const HOUSE = {
  wall:  texMat(0xefe4cf, plasterTex),
  floor: texMat(0xc39a6b, plankTex),
  ceil:  texMat(0xf7f1e4, plasterTex),
  trim:  texMat(0x9b7248, woodTex)
};

/* the spines of the real work: aged gold leaf, banded a few shades down —
   the same relationship every other book on the shelf has */
const WORK_COLOR = 0xa8863c;
const WORK_MAT = flatMat(WORK_COLOR);
const WORK_BAND = flatMat(shade(WORK_COLOR, 1.42));
/* antique leather: five muted tones that sit together, so the gold spines of the
   real work are the only thing on a shelf that shouts */
const BOOK_COLORS = [0x8c3b32, 0xa8703c, 0x4a6146, 0x3f4a63, 0x6b4a63];
const BOOK_MATS = BOOK_COLORS.map(c => flatMat(c));
const BAND_MATS = BOOK_COLORS.map(c => flatMat(shade(c, 1.42)));   // lighter than the spine
const PAGE_MAT = flatMat(0xe8e0cc);                                // the page block
const lineMat = new THREE.LineBasicMaterial({color:INK});

const aabbs = [];       // solid boxes: {x0,x1,z0,z1,y0,y1,land}
const segs  = [];       // solid wall segments: {ax,az,bx,bz,ht,y0,y1}
const occluders = [];   // every raycastable mesh

let seed = 7;
function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

/* white box + black outline (the whole world is made of these) */
function box(w,h,d,x,y,z,o){
  o = o || {};
  const g = new THREE.BoxGeometry(w,h,d);
  const m = new THREE.Mesh(g, o.mat || meshMat); m.position.set(x,y,z); scene.add(m);
  occluders.push(m);
  if (o.surface) m.userData.surface = true;
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), lineMat);
  e.position.set(x,y,z); scene.add(e);
  if (o.solid) aabbs.push({x0:x-w/2, x1:x+w/2, z0:z-d/2, z1:z+d/2, y0:y-h/2, y1:y+h/2, land:o.land !== false});
  return m;
}

/* mesh + outline as part of a group (for items, trophies, furniture) */
function part(g, geo, px, py, pz, rx, ry, rz, mat){
  const m = new THREE.Mesh(geo, mat || meshMat);
  m.position.set(px, py, pz); m.rotation.set(rx || 0, ry || 0, rz || 0);
  g.add(m);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat);
  e.position.copy(m.position); e.rotation.copy(m.rotation);
  g.add(e);
  return m;
}

/* many boxes merged into one fill mesh + one outline object (bookshelves etc.) */
function mergedBoxes(list, mat){
  const fArr = [], eArr = [];
  const m4 = new THREE.Matrix4(), eu = new THREE.Euler(), q = new THREE.Quaternion();
  const sc = new THREE.Vector3(1,1,1), tv = new THREE.Vector3();
  for (const b of list){
    const g = new THREE.BoxGeometry(b.w, b.h, b.d);
    eu.set(b.rx || 0, b.ry || 0, b.rz || 0); q.setFromEuler(eu); tv.set(b.x, b.y, b.z);
    m4.compose(tv, q, sc); g.applyMatrix4(m4);
    fArr.push(g.toNonIndexed().getAttribute('position').array);
    eArr.push(new THREE.EdgesGeometry(g).getAttribute('position').array);
  }
  function build(arrs){
    let n = 0; for (const a of arrs) n += a.length;
    const out = new Float32Array(n); let o = 0;
    for (const a of arrs){ out.set(a, o); o += a.length; }
    const bg = new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.BufferAttribute(out, 3));
    return bg;
  }
  return { fill: new THREE.Mesh(build(fArr), mat || meshMat),
           edge: new THREE.LineSegments(build(eArr), lineMat) };
}

/* a LineSegments object from flat [x,y,z] point pairs */
function linesFlat(pts, m){
  const a = new Float32Array(pts.length * 3);
  for (let i = 0; i < pts.length; i++){ a[i*3] = pts[i][0]; a[i*3+1] = pts[i][1]; a[i*3+2] = pts[i][2]; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(a, 3));
  return new THREE.LineSegments(g, m || lineMat);
}
function loopLine(pts, y){
  const v = pts.map(p => new THREE.Vector3(p[0], y, p[1]));
  scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(v), lineMat));
}

/* ============ walls with doorways ============ */
const T = 0.16, DOOR_W = 1.9, DOOR_H = 2.2;

function cut(s0, g0, g1){
  const out = [];
  for (const s of s0){
    if (g1 <= s[0] || g0 >= s[1]) { out.push(s); continue; }
    if (g0 > s[0]) out.push([s[0], g0]);
    if (g1 < s[1]) out.push([g1, s[1]]);
  }
  return out;
}
function wallX(z, a, b, doors, h, mat){      // wall running along X at fixed z
  h = h || 3.2;
  let s0 = [[a, b]];
  for (const c of (doors || [])){
    s0 = cut(s0, c - DOOR_W/2, c + DOOR_W/2);
    box(DOOR_W, h - DOOR_H, T, c, DOOR_H + (h - DOOR_H)/2, z, {solid:true, mat});  // header (you can bonk your head)
  }
  for (const s of s0) if (s[1] - s[0] > 0.02)
    box(s[1]-s[0], h, T, (s[0]+s[1])/2, h/2, z, {solid:true, mat});
}
function wallZ(x, a, b, doors, h, mat){     // wall running along Z at fixed x
  h = h || 3.2;
  let s0 = [[a, b]];
  for (const c of (doors || [])){
    s0 = cut(s0, c - DOOR_W/2, c + DOOR_W/2);
    box(T, h - DOOR_H, DOOR_W, x, DOOR_H + (h - DOOR_H)/2, c, {solid:true, mat});
  }
  for (const s of s0) if (s[1] - s[0] > 0.02)
    box(T, h, s[1]-s[0], x, h/2, (s[0]+s[1])/2, {solid:true, mat});
}
/* a wall between two arbitrary points (the hexagon needs these) */
function segWall(ax, az, bx, bz, h, t, mat){
  const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz);
  const g = new THREE.BoxGeometry(L, h, t);
  const m = new THREE.Mesh(g, mat || meshMat);
  m.position.set((ax+bx)/2, h/2, (az+bz)/2);
  m.rotation.y = Math.atan2(-dz, dx);
  scene.add(m); occluders.push(m);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), lineMat);
  e.position.copy(m.position); e.rotation.copy(m.rotation);
  scene.add(e);
  segs.push({ax, az, bx, bz, ht: t/2, y0: 0, y1: h});
  return m;
}

/* ============ hand-written labels (auto-shrink to fit) ============ */
function makeLabel(text, w, fontPx, color){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 150;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color || '#141414';
  let f = (fontPx || 64) + 2;
  do {
    f -= 2;
    ctx.font = '600 ' + f + 'px Georgia,"Times New Roman",serif';
  } while (ctx.measureText(text).width > c.width - 60 && f > 16);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 512, 80);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  return new THREE.Mesh(new THREE.PlaneGeometry(w, w * 150 / 1024),
    new THREE.MeshBasicMaterial({map: tex, transparent: true}));
}
function hang(obj, x, y, z, face){
  obj.position.set(x, y, z);
  if (face === '+x') obj.rotation.y =  Math.PI/2;
  if (face === '-x') obj.rotation.y = -Math.PI/2;
  if (face === '-z') obj.rotation.y =  Math.PI;
  scene.add(obj);
  return obj;
}

const readables = [];
function markRead(meshes, entry){
  for (const m of meshes){ m.userData.read = entry; occluders.push(m); }
  if (!entry._pos){ entry._pos = new THREE.Vector3(); readables.push(entry); }
  entry._anchor = meshes[0];
}
function markGroupRead(g, entry){
  const ms = [];
  g.traverse(o => { if (o.isMesh) ms.push(o); });
  markRead(ms, entry);
}

const items = [];
function makeItem(id, name, x, y, z, build){
  const g = new THREE.Group();
  build(g);
  g.position.set(x, y + 0.002, z);
  g.rotation.y = Math.random() * Math.PI * 2;
  scene.add(g);
  const item = {id, name, group: g, meshes: []};
  g.traverse(o => {
    if (o.isMesh){ o.userData.item = item; item.meshes.push(o); occluders.push(o); }
  });
  items.push(item);
  return item;
}

/* ================================================================
   THE LIBRARY OF BABEL — a chain of hexagonal galleries running north.

   Gallery 0 holds everything. Its north door is sealed until you stand at
   the lectern and pick a filter (field: Calculus, source: Green Book, …).
   Choosing one builds the next hexagon beyond that door holding only the
   matching pieces, and that room has a lectern of its own. Filters that
   would match nothing are never offered, so a room with no matches is
   never built — and a room that cannot be narrowed keeps its door shut.
   ================================================================ */
const GAL_DZ = 2 * SQ3_2 * HEX_R;             // centre-to-centre spacing, sharing a wall
const galleries = [];

/* everything a gallery builds is appended to these registries, so a gallery is
   torn down by rewinding them to the lengths they had when it started */
const fallers = [];                           // books tumbling down the shafts
const spinners = [];                          // the gold solids turning over the lecterns
function markState(){
  return {sc:scene.children.length, ab:aabbs.length, sg:segs.length,
          oc:occluders.length, rd:readables.length, fl:fallers.length, sp:spinners.length,
          fm:flames.length};
}
function truncTo(m){
  while (scene.children.length > m.sc){
    const o = scene.children[scene.children.length - 1];
    scene.remove(o);
    o.traverse(x => { if (x.geometry) x.geometry.dispose(); });
  }
  aabbs.length = m.ab; segs.length = m.sg;
  occluders.length = m.oc; readables.length = m.rd;
  fallers.length = m.fl; spinners.length = m.sp; flames.length = m.fm;
}

/* ---- a turned-baluster railing round the shaft: solid to walk into, but open
       enough to watch the books go past ---- */
function balustrade(ax, az, bx, bz){
  const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz);
  const g = new THREE.Group();
  g.position.set((ax + bx)/2, 0, (az + bz)/2);
  g.rotation.y = Math.atan2(-dz, dx);          // local +x runs along the rail
  scene.add(g);
  part(g, new THREE.BoxGeometry(L, 0.10, 0.17), 0, 0.06, 0, 0,0,0, LIB.oak);       // foot rail
  part(g, new THREE.BoxGeometry(L, 0.12, 0.21), 0, 1.00, 0, 0,0,0, LIB.oak);       // handrail
  const n = Math.max(2, Math.round(L / 0.32)), posts = [];
  for (let i = 0; i <= n; i++){
    const x = -L/2 + L * i / n;
    posts.push({w:0.065, h:0.84, d:0.065, x, y:0.53, z:0});
    posts.push({w:0.10,  h:0.06, d:0.10,  x, y:0.17, z:0});     // turned collars
    posts.push({w:0.10,  h:0.06, d:0.10,  x, y:0.89, z:0});
  }
  const mb = mergedBoxes(posts, LIB.oakLite);
  g.add(mb.fill); g.add(mb.edge);
  segs.push({ax, az, bx, bz, ht:0.09, y0:0, y1:1.06});           // you still cannot walk through
}

/* ---- books falling forever down the shaft. Pure atmosphere: no collision,
       no raycast, they just tumble past and start again at the top. ---- */
const FALL_TOP = 15.5, FALL_BOTTOM = -12.8;
function fallingBooks(cz, n){
  for (let i = 0; i < n; i++){
    const g = new THREE.Group();
    const w = 0.17 + rnd() * 0.10, h = 0.24 + rnd() * 0.12, d = 0.05 + rnd() * 0.04;
    const geo = new THREE.BoxGeometry(w, h, d);
    const ci = (rnd() * BOOK_MATS.length) | 0;
    const m = new THREE.Mesh(geo, BOOK_MATS[ci]);
    g.add(m);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat);
    g.add(e);
    const bands = [];
    for (const f of [0.27, -0.23])
      bands.push({w:w * 1.05, h:h * 0.07 + 0.004, d:d * 1.06, x:0, y:h * f, z:0});
    const bb = mergedBoxes(bands, BAND_MATS[ci]);
    g.add(bb.fill); g.add(bb.edge);
    const a = rnd() * Math.PI * 2, r = 0.35 + rnd() * 1.15;
    g.position.set(Math.cos(a) * r, FALL_BOTTOM + rnd() * (FALL_TOP - FALL_BOTTOM), cz + Math.sin(a) * r);
    g.rotation.set(rnd() * 6.28, rnd() * 6.28, rnd() * 6.28);
    scene.add(g);
    fallers.push({g, cz, v: 1.1 + rnd() * 1.9,
                  sx: (rnd() - 0.5) * 1.6, sy: (rnd() - 0.5) * 1.2, sz: (rnd() - 0.5) * 1.6});
  }
}

/* ---- and the mathematics itself, falling with them: gold sigils drifting down
       the shaft, turning to face you, breathing light. Whatever built this place
       is still pouring it in. ---- */
function fallingGlyphs(cz, n){
  for (let i = 0; i < n; i++){
    const gl = makeGlyph(GLYPHS[(i * 3 + (n | 0)) % GLYPHS.length], 0.38 + rnd() * 0.44, '#f4dd9b');
    gl.material.depthWrite = false;
    const a = rnd() * 6.28, r = rnd() * 1.35;
    gl.position.set(Math.cos(a) * r, FALL_BOTTOM + rnd() * (FALL_TOP - FALL_BOTTOM), cz + Math.sin(a) * r);
    scene.add(gl);
    fallers.push({g: gl, cz, v: 0.35 + rnd() * 0.65, glyph: true, ph: rnd() * 6.28,
                  s0: gl.scale.x, sx:0, sy:0, sz:0});
  }
}

/* ---- the little antique case: click it for everything on this room's shelves ---- */
function littleCase(cz, entry){
  const g = new THREE.Group();
  g.position.set(-2.4, 0, cz + 5.72);
  g.rotation.y = Math.PI;                     // stands against the south wall, facing the room
  scene.add(g);
  const W = 1.44, H = 1.72, D = 0.46;
  part(g, new THREE.BoxGeometry(W + 0.16, 0.16, D + 0.09), 0, 0.08, 0, 0,0,0, LIB.oakDark);  // plinth
  part(g, new THREE.BoxGeometry(W - 0.26, H, 0.05), 0, 0.16 + H/2, -D/2 + 0.03, 0,0,0, LIB.oakDark);
  for (const sx of [-1, 1]){                                             // carved pilasters
    part(g, new THREE.BoxGeometry(0.13, H, D), sx * (W/2 - 0.065), 0.16 + H/2, 0, 0,0,0, LIB.oak);
    part(g, new THREE.BoxGeometry(0.17, 0.12, D + 0.04), sx * (W/2 - 0.065), 0.30, 0, 0,0,0, LIB.oakLite);
    part(g, new THREE.BoxGeometry(0.17, 0.12, D + 0.04), sx * (W/2 - 0.065), 1.74, 0, 0,0,0, LIB.oakLite);
  }
  /* Four shelves, and the top one has clear air above it — the old design put a
     frieze across the opening so the top row could never have been pulled out. */
  const SH = [0.30, 0.66, 1.02, 1.38];                                  // shelf boards
  for (const y of SH) part(g, new THREE.BoxGeometry(W - 0.24, 0.05, D - 0.06), 0, y, 0.01, 0,0,0, LIB.oak);
  part(g, new THREE.BoxGeometry(W - 0.24, 0.05, D - 0.06), 0, 1.74, 0.01, 0,0,0, LIB.oak);   // top board
  part(g, new THREE.BoxGeometry(W + 0.20, 0.13, D + 0.12), 0, 1.83, 0, 0,0,0, LIB.oak);      // cornice
  part(g, new THREE.BoxGeometry(0.30, 0.13, 0.07), 0, 1.95, 0.02, 0,0,0, LIB.oakLite);       // crest
  part(g, new THREE.BoxGeometry(0.12, 0.07, 0.07), 0, 2.04, 0.02, 0,0,0, LIB.oakLite);
  /* rows of dark leather spines, each banded */
  const rows = BOOK_MATS.map(() => []);
  const caseBands = BOOK_MATS.map(() => []);
  const casePages = [];
  for (const y of SH){
    let x = -(W/2 - 0.20);
    while (x < W/2 - 0.22){
      if (rnd() < 0.09){ x += 0.05 + rnd() * 0.06; continue; }
      const bw = 0.035 + rnd() * 0.045, bh = 0.17 + rnd() * 0.10;
      const bx = x + bw/2, by = y + 0.025 + bh/2, tilt = (rnd() < 0.12 ? (rnd() - 0.5) * 0.28 : 0);
      const ci = (rnd() * rows.length) | 0;
      rows[ci].push({w:bw, h:bh, d:0.24, x:bx, y:by, z:0.03, rz:tilt});
      for (const f of [0.28, -0.24])
        caseBands[ci].push({w:bw * 1.07, h:bh * 0.06 + 0.006, d:0.252, x:bx, y:by + bh * f, z:0.03, rz:tilt});
      for (const e of [1, -1])
        casePages.push({w:bw * 0.94, h:0.020, d:0.236, x:bx, y:by + e * (bh/2 - 0.010), z:0.03, rz:tilt});
      x += bw + 0.008;
    }
  }
  rows.forEach((r, i) => {
    if (!r.length) return;
    const mb = mergedBoxes(r, BOOK_MATS[i]);
    g.add(mb.fill); g.add(mb.edge);
  });
  caseBands.forEach((list, bi) => {
    if (!list.length) return;
    const cb2 = mergedBoxes(list, BAND_MATS[bi]);
    g.add(cb2.fill); g.add(cb2.edge);
  });
  if (casePages.length){
    const pb2 = mergedBoxes(casePages, PAGE_MAT);
    g.add(pb2.fill); g.add(pb2.edge);
  }
  aabbs.push({x0:-2.4 - W/2, x1:-2.4 + W/2, z0:cz + 5.72 - D/2 - 0.06, z1:cz + 5.72 + D/2 + 0.06,
              y0:0, y1:2.2, land:true});
  markGroupRead(g, entry);
  return g;
}

/* ---- candle flame: a tapered bright body inside an additive halo that
       breathes and flickers, and always turns its face to you ---- */
const flames = [];
const glowTex = makeTex((x, S) => {
  const g = x.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  g.addColorStop(0.00, 'rgba(255,244,205,1)');
  g.addColorStop(0.18, 'rgba(255,206,110,0.85)');
  g.addColorStop(0.45, 'rgba(240,150,45,0.32)');
  g.addColorStop(1.00, 'rgba(190,90,20,0)');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
}, 1);
glowTex.wrapS = glowTex.wrapT = THREE.ClampToEdgeWrapping;
const glowMat = new THREE.MeshBasicMaterial({map: glowTex, transparent: true,
                                             blending: THREE.AdditiveBlending, depthWrite: false});
const FLAME_GEO = new THREE.LatheGeometry([
  [0.000, 0.000], [0.020, 0.012], [0.028, 0.040], [0.024, 0.075],
  [0.014, 0.105], [0.005, 0.128], [0.000, 0.140]
].map(p => new THREE.Vector2(p[0], p[1])), 10);
const flameCore = new THREE.MeshBasicMaterial({color: 0xffe9a8});
function flame(parent, x, y, z){
  const body = new THREE.Mesh(FLAME_GEO, flameCore);
  body.position.set(x, y, z);
  parent.add(body);
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.42), glowMat);
  halo.position.set(x, y + 0.06, z);
  parent.add(halo);
  flames.push({body, halo, ph: rnd() * 6.28, y0: y});
  return body;
}

/* an iron chandelier of candles, hung on a chain */
function chandelier(x, z, yTop, drop, n, R){
  n = n || 6; R = R || 0.46;
  scene.add(linesFlat([[x, yTop, z], [x, yTop - drop, z]]));
  const g = new THREE.Group(); g.position.set(x, yTop - drop, z); scene.add(g);
  part(g, new THREE.CylinderGeometry(0.05, 0.05, 0.13, 6), 0, 0.02, 0, 0,0,0, LIB.iron);   // boss
  part(g, new THREE.TorusGeometry(R, 0.028, 5, 14), 0, -0.10, 0, Math.PI/2, 0, 0, LIB.iron);
  const spokes = [], cups = [], wax = [];
  for (let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2, cx = Math.cos(a) * R, cz = Math.sin(a) * R;
    const h = 0.20 + (i % 3) * 0.05;
    spokes.push({w:R, h:0.025, d:0.025, x:cx/2, y:-0.04, z:cz/2, ry:-a});
    cups.push({w:0.11, h:0.035, d:0.11, x:cx, y:-0.075, z:cz});
    wax.push({w:0.065, h:h, d:0.065, x:cx, y:-0.05 + h/2, z:cz});
    flame(g, cx, -0.05 + h + 0.005, cz);
  }
  const add = (list, mat) => { const mb = mergedBoxes(list, mat); g.add(mb.fill); g.add(mb.edge); };
  add(spokes, LIB.iron); add(cups, LIB.iron); add(wax, LIB.wax);
  return g;
}
/* a single candle on a wall bracket */
function sconce(x, y, z, face){
  const g = new THREE.Group();
  g.position.set(x, y, z);
  if (face === '+x') g.rotation.y =  Math.PI/2;
  if (face === '-x') g.rotation.y = -Math.PI/2;
  if (face === '-z') g.rotation.y =  Math.PI;
  scene.add(g);
  part(g, new THREE.BoxGeometry(0.05, 0.30, 0.05), 0, 0, 0.02, 0,0,0, LIB.iron);      // back plate
  part(g, new THREE.BoxGeometry(0.04, 0.04, 0.22), 0, -0.10, 0.14, 0,0,0, LIB.iron);  // arm
  part(g, new THREE.CylinderGeometry(0.06, 0.045, 0.03, 8), 0, -0.07, 0.24, 0,0,0, LIB.iron);
  part(g, new THREE.CylinderGeometry(0.028, 0.032, 0.20, 6), 0, 0.04, 0.24, 0,0,0, LIB.wax);
  flame(g, 0, 0.145, 0.24);
  return g;
}

/* a flat hexagonal ring (floor, ceiling, rug): outer radius R, hole radius r */
function hexRing(R, r, thick){
  const s = new THREE.Shape();
  const o = hexPts(0, 0, R);
  s.moveTo(o[0][0], o[0][1]);
  for (let i = 1; i < 6; i++) s.lineTo(o[i][0], o[i][1]);
  s.closePath();
  const h = new THREE.Path();
  const q = hexPts(0, 0, r);
  h.moveTo(q[5][0], q[5][1]);
  for (let i = 4; i >= 0; i--) h.lineTo(q[i][0], q[i][1]);
  h.closePath();
  s.holes.push(h);
  const geo = new THREE.ExtrudeGeometry(s, {depth: thick, bevelEnabled: false});
  geo.rotateX(Math.PI / 2);                   // shape XY -> world XZ, thickness going down
  return geo;
}
function hexCap(R, thick){                    // a solid hexagonal slab, no hole
  const s = new THREE.Shape();
  const o = hexPts(0, 0, R);
  s.moveTo(o[0][0], o[0][1]);
  for (let i = 1; i < 6; i++) s.lineTo(o[i][0], o[i][1]);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, {depth: thick, bevelEnabled: false});
  geo.rotateX(Math.PI / 2);
  return geo;
}
/* one face of the shaft lining: scenery only, never a collider */
function wellPanel(ax, az, bx, bz, y0, y1){
  const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz), h = y1 - y0;
  const geo = new THREE.BoxGeometry(L, h, 0.10);
  const m = new THREE.Mesh(geo, LIB.well);
  m.position.set((ax + bx) / 2, (y0 + y1) / 2, (az + bz) / 2);
  m.rotation.y = Math.atan2(-dz, dx);
  scene.add(m); occluders.push(m);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat);
  e.position.copy(m.position); e.rotation.copy(m.rotation);
  scene.add(e);
  return m;
}
function ringPiece(geo, y, cz, mat, surface){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(0, y, cz);
  if (surface) m.userData.surface = true;
  scene.add(m); occluders.push(m);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat);
  e.position.copy(m.position); scene.add(e);
  return m;
}

/* ---- four shelved walls. Each one carries a subject, and every work on it
       gets a gold spine you can aim at and open. ---- */
const SLOT_X = [-1.95, -0.98, 0, 0.98, 1.95];
const SLOT_ORDER = [];                       // eye-level shelves get filled first
for (const si of [1, 2, 0, 3]) for (const sx of SLOT_X) SLOT_ORDER.push([si, sx]);

function buildShelfWall(A, B, subject, works, fill){
  const dx = B[0]-A[0], dz = B[1]-A[1], L = Math.hypot(dx, dz);
  const nx = -dz/L, nz = dx/L;                          // inward normal
  const mx = (A[0]+B[0])/2, mz = (A[1]+B[1])/2;
  const D = 0.42, W = 5.6, H = 5.15;
  const off = T/2 + D/2 + 0.03;
  const g = new THREE.Group();
  g.position.set(mx + nx*off, 0, mz + nz*off);
  g.rotation.y = Math.atan2(nx, nz);
  scene.add(g);
  function cb(w,h,d,x,y,z,mm){
    const geo = new THREE.BoxGeometry(w,h,d);
    const m = new THREE.Mesh(geo, mm || LIB.oak); m.position.set(x,y,z);
    m.userData.surface = true;
    g.add(m); occluders.push(m);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat);
    e.position.copy(m.position); g.add(e);
    return m;
  }
  cb(0.1, H, D, -(W/2 - 0.05), H/2, 0);
  cb(0.1, H, D,  (W/2 - 0.05), H/2, 0);
  cb(W, 0.1, D, 0, H - 0.05, 0);
  cb(W, H, 0.05, 0, H/2, -D/2 + 0.03, LIB.oakDark);   // dark recess, like the little case
  const SHELF_Y = [0.16, 0.98, 1.80, 2.62, 3.44, 4.26];
  for (const sy of SHELF_Y) cb(W - 0.2, 0.08, D - 0.08, 0, sy, 0);

  /* which slots the real books claim — the filler leaves room for them */
  const mine = (works || []).slice(0, SLOT_ORDER.length);
  const reserved = SLOT_ORDER.slice(0, mine.length);

  /* the nameless books that fill the rest of the shelf. The further a gallery has
     been narrowed, the emptier it stands — so the gold spines stay findable. */
  const gap = 0.10 + (1 - (fill === undefined ? 1 : fill)) * 0.55;
  const buckets = BOOK_MATS.map(() => []);
  const spineBands = BOOK_MATS.map(() => []);
  const pages = [];
  for (let si = 0; si < SHELF_Y.length; si++){
    const top = SHELF_Y[si] + 0.04;
    let x = -(W/2 - 0.28);
    while (x < W/2 - 0.3){
      if (rnd() < gap){ x += 0.16 + rnd()*0.15; continue; }
      const bw = 0.06 + rnd()*0.09;
      let skip = false;
      for (const r of reserved) if (r[0] === si && Math.abs(x - r[1]) < 0.30) skip = true;
      if (!skip){
        const bh = 0.26 + rnd()*0.17;
        const bx = x + bw/2, by = top + bh/2, tilt = (rnd() < 0.14 ? (rnd() - 0.5) * 0.3 : 0);
        const ci = (rnd() * buckets.length) | 0;
        buckets[ci].push({w:bw, h:bh, d:0.26, x:bx, y:by, z:0.02, rz:tilt});
        /* two raised bands across the spine, so it reads as a bound book */
        for (const f of [0.28, -0.24])
          spineBands[ci].push({w:bw * 1.06, h:bh * 0.055 + 0.008, d:0.272, x:bx, y:by + bh * f, z:0.02, rz:tilt});
        for (const e of [1, -1])
          pages.push({w:bw * 0.94, h:0.026, d:0.256, x:bx, y:by + e * (bh/2 - 0.013), z:0.02, rz:tilt});
      }
      x += bw + 0.012;
    }
  }
  for (let bi = 0; bi < buckets.length; bi++){
    if (!buckets[bi].length) continue;
    const mb = mergedBoxes(buckets[bi], BOOK_MATS[bi]);
    g.add(mb.fill); g.add(mb.edge); occluders.push(mb.fill);
  }
  spineBands.forEach((list, bi) => {
    if (!list.length) return;
    const sb = mergedBoxes(list, BAND_MATS[bi]);
    g.add(sb.fill); g.add(sb.edge);
  });
  if (pages.length){
    const pb = mergedBoxes(pages, PAGE_MAT);
    g.add(pb.fill); g.add(pb.edge);
  }

  /* the gold spines: one per piece of work, banded in brass */
  const gilt = [];
  mine.forEach((w, i) => {
    const slot = reserved[i];
    const geo = new THREE.BoxGeometry(0.11, 0.40, 0.30);
    const m = new THREE.Mesh(geo, WORK_MAT);
    m.position.set(slot[1], SHELF_Y[slot[0]] + 0.04 + 0.20, 0.06);
    m.rotation.z = ((i % 3) - 1) * 0.055;
    g.add(m);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat);
    e.position.copy(m.position); e.rotation.copy(m.rotation);
    g.add(e);
    for (const dy of [0.13, -0.11])
      gilt.push({w:0.118, h:0.032, d:0.312, x:m.position.x, y:m.position.y + dy, z:0.06});
  });
  if (gilt.length){
    const gb = mergedBoxes(gilt, WORK_BAND);
    g.add(gb.fill); g.add(gb.edge);
  }

  if ((works || []).length > SLOT_ORDER.length)
    console.warn('shelf "' + subject + '" has more works than slots; ' +
                 ((works.length) - SLOT_ORDER.length) + ' left off the wall');
  return {group:g, SHELF_Y};
}

/* ---- what the four walls of a room hold ---- */
const SHELF_SUBJECTS = ['number theory', 'calculus', 'probability & logic', 'physics, code & other'];
const ROMAN = ['i', 'ii', 'iii', 'iv'];
function shelfOf(w){
  return SHELF_SUBJECTS.indexOf(w.shelf) > -1 ? w.shelf : SHELF_SUBJECTS[SHELF_SUBJECTS.length - 1];
}
function splitAcrossWalls(works, depth){
  if (depth === 0)                              // the whole library keeps its subject walls
    return SHELF_SUBJECTS.map(s => ({label: s, works: works.filter(w => shelfOf(w) === s)}));
  const per = Math.max(1, Math.ceil(works.length / 4));
  return ROMAN.map((r, i) => {
    const chunk = works.slice(i * per, (i + 1) * per);
    return {label: chunk.length ? 'shelf ' + r : '', works: chunk};
  });
}

/* ---- the facets a room can still be narrowed by ---- */
const FACETS = [
  {key:'field',       label:'field'},
  {key:'source',      label:'source'},
  {key:'type',        label:'type'},
  {key:'technique',   label:'technique'},
  {key:'proofMethod', label:'proof method'}
];
function facetOptions(works, chain){
  const out = [];
  for (const f of FACETS){
    const counts = new Map();
    for (const w of works) for (const v of (w[f.key] || [])) counts.set(v, (counts.get(v) || 0) + 1);
    for (const [value, n] of counts){
      if (n === works.length) continue;         // matches everything here: opens an identical room
      if (chain.some(c => c.key === f.key && c.value === value)) continue;
      out.push({key: f.key, label: f.label, value, n});
    }
  }
  return out;                                   // n is always >= 1, so an empty room is never offered
}
function galleryName(chain){
  return chain.length ? 'Gallery — ' + chain.map(c => c.value).join(' · ')
                      : 'The Library of Babel';
}

/* ---- the sealed door filling a gallery's north doorway ---- */
function buildSeal(G){
  const zc = G.nz, grp = new THREE.Group();
  grp.position.set(0, 0, zc);
  scene.add(grp);
  const geo = new THREE.BoxGeometry(1.92, 2.22, 0.10);
  const m = new THREE.Mesh(geo, LIB.door);
  m.position.set(0, 1.11, 0);
  grp.add(m); occluders.push(m);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat);
  e.position.copy(m.position); grp.add(e);
  /* four sunken panels */
  for (const px of [-0.44, 0.44]) for (const py of [0.62, 1.62])
    part(grp, new THREE.BoxGeometry(0.70, 0.82, 0.03), px, py, 0.055, 0,0,0, LIB.doorDim);
  /* iron bands, hammered studs, and a ring to pull on */
  for (const by of [0.30, 1.11, 1.94]){
    part(grp, new THREE.BoxGeometry(1.94, 0.11, 0.045), 0, by, 0.06, 0,0,0, LIB.iron);
    const studs = [];
    for (let i = -3; i <= 3; i++) studs.push({w:0.055, h:0.055, d:0.03, x:i * 0.29, y:by, z:0.086});
    const sb = mergedBoxes(studs, LIB.brass);
    grp.add(sb.fill); grp.add(sb.edge);
  }
  part(grp, new THREE.TorusGeometry(0.13, 0.022, 6, 16), 0.62, 1.11, 0.10, 0, 0, 0, LIB.brass);

  const ab = {x0:-0.96, x1:0.96, z0:zc - 0.07, z1:zc + 0.07, y0:0, y1:2.22, land:false};
  aabbs.push(ab);
  const entry = {
    title: 'the sealed door',
    body: 'Beyond this door is the next gallery — but a gallery has to be about something.\n\nStand at the lectern behind you and choose a filter. Whichever one you pick, this door opens onto a hexagon holding only the pieces that match, and that room has a lectern of its own.\n\nFilters that match nothing are never offered, so there is no such thing as an empty gallery.'
  };
  markRead([m], entry);
  G.seal = {grp, ab, mesh: m, entry};
}
function removeSeal(G){
  if (!G.seal) return;
  const s = G.seal;
  scene.remove(s.grp);
  s.grp.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  let i = aabbs.indexOf(s.ab);        if (i > -1) aabbs.splice(i, 1);
  i = occluders.indexOf(s.mesh);      if (i > -1) occluders.splice(i, 1);
  i = readables.indexOf(s.entry);     if (i > -1) readables.splice(i, 1);
  G.seal = null;
}

/* ---- build one hexagonal gallery ---- */
function buildGallery(depth, works, chain){
  const cz = HEX_Z - depth * GAL_DZ;            // its centre
  const nz = cz - SQ3_2 * HEX_R;                // its north wall (= the next room's south wall)
  const G = {depth, cz, nz, works, chain, name: galleryName(chain),
             mark: markState(), seal: null, next: null, opts: null};
  galleries[depth] = G;

  const V = hexPts(0, cz, HEX_R);
  wallX(nz, -3.5, 3.5, [0], LIB_H, LIB.wall);                        // north, with a doorway
  segWall(V[0][0], V[0][1], V[1][0], V[1][1], LIB_H, T, LIB.wall);   // 4 diagonal walls
  segWall(V[2][0], V[2][1], V[3][0], V[3][1], LIB_H, T, LIB.wall);
  segWall(V[3][0], V[3][1], V[4][0], V[4][1], LIB_H, T, LIB.wall);
  segWall(V[5][0], V[5][1], V[0][0], V[0][1], LIB_H, T, LIB.wall);

  /* floor and ceiling: rings with the shaft hole in the middle */
  const ring = hexRing(HEX_R, HOLE_R, 0.14);
  ringPiece(ring, 0, cz, LIB.floor, true);
  ringPiece(ring, LIB_H + 0.14, cz, LIB.ceil, false);
  aabbs.push({x0:-HEX_R, x1:HEX_R, z0:nz, z1:cz + SQ3_2*HEX_R,
              y0:LIB_H, y1:LIB_H + 0.14, land:false});

  /* The well. It is lined in dark stone and shut at both ends, so a gallery is
     sealed: you can no longer see the wireframe of the next room's shaft through
     the floor, which was giving the whole trick away. The mathematics that used
     to be on the walls is written down the inside of it instead. */
  const WT = -13.4, WB = 17.2;                            // how far the lining runs
  const HP = hexPts(0, cz, HOLE_R);
  for (let k = 0; k < 6; k++){
    const a = HP[k], b = HP[(k + 1) % 6];
    wellPanel(a[0], a[1], b[0], b[1], WT, 0);                       // below the floor
    wellPanel(a[0], a[1], b[0], b[1], LIB_H + 0.14, WB);            // above the ceiling
  }
  ringPiece(hexCap(HOLE_R + 0.06, 0.12), WT, cz, LIB.wellEnd, false);
  ringPiece(hexCap(HOLE_R + 0.06, 0.12), WB, cz, LIB.wellEnd, false);


  /* rug, and a low railing so you have to mean it to fall in */
  ringPiece(hexRing(5.2, 2.75, 0.03), 0.03, cz, depth % 2 ? LIB.rugDeep : LIB.brick, true);
  const RP = hexPts(0, cz, RAIL_R);
  for (let k = 0; k < 6; k++){
    const a = RP[k], b = RP[(k + 1) % 6];
    balustrade(a[0], a[1], b[0], b[1]);
  }

  /* candlelight: two chandeliers over the well, and sconces on the flat walls */
  /* mirrored about x = 0, which is the room's only axis of symmetry */
  for (const sx of [-1, 1]){
    chandelier(sx * 3.1, cz + 1.7, LIB_H, 1.5, 6, 0.44);
    chandelier(sx * 3.1, cz - 1.7, LIB_H, 1.5, 6, 0.44);
    sconce(sx * 2.9, 2.35, cz + SQ3_2*HEX_R - T/2 - 0.03, '-z');
    sconce(sx * 2.9, 2.35, nz + T/2 + 0.03, '+z');
  }
  chandelier(0, cz - 4.5, LIB_H, 2.2, 8, 0.58);

  /* the shelves. Each work gets a fresh entry object so the same piece can sit
     on a shelf in several rooms at once and each copy keeps its own position. */
  const split = splitAcrossWalls(works, depth);
  const WALLS = [[V[0], V[1]], [V[2], V[3]], [V[3], V[4]], [V[5], V[0]]];
  const fill = Math.max(0.15, 1 - depth * 0.35);
  split.forEach((s, i) => {
    buildShelfWall(WALLS[i][0], WALLS[i][1], s.label,
                   s.works.map(w => Object.assign({}, w)), fill);
  });

  /* the plaque saying what this room is */
  const pz = nz + T/2 + 0.035;
  box(1.09, 0.79, 0.05, 2.55, 1.7, pz, {mat: LIB.oak});          // oak surround
  const plaque = box(0.93, 0.63, 0.06, 2.55, 1.7, pz + 0.02, {mat: LIB.back});
  markRead([plaque], {
    title: G.name,
    body: (depth === 0
            ? CONTENT.babelPlaque.body
            : 'This gallery holds only the pieces where ' +
              chain.map(c => c.label + ' is ' + c.value).join(', and ') + '.') +
          '\n\n' + works.length + (works.length === 1 ? ' piece' : ' pieces') +
          ' on these shelves.' +
          (depth ? '\n\nThe way back south leads to ' + galleryName(chain.slice(0, -1)) + '.' : '')
  });

  /* The reading lectern: a carved oak stand with the room's ledger open on it,
     and above it a slowly turning solid of gold — the hand that built the place
     still deciding what the next room is going to be about. */
  const fg = new THREE.Group();
  fg.position.set(2.05, 0, cz - 4.55); fg.rotation.y = -0.55;
  scene.add(fg);
  part(fg, new THREE.BoxGeometry(0.62, 0.10, 0.52), 0, 0.05, 0, 0,0,0, LIB.oakDark);   // stepped foot
  part(fg, new THREE.BoxGeometry(0.46, 0.07, 0.38), 0, 0.13, 0, 0,0,0, LIB.oak);
  part(fg, new THREE.BoxGeometry(0.13, 0.92, 0.13), 0, 0.62, 0, 0,0,0, LIB.oak);       // column
  part(fg, new THREE.BoxGeometry(0.19, 0.08, 0.19), 0, 0.26, 0, 0,0,0, LIB.oakLite);   // collars
  part(fg, new THREE.BoxGeometry(0.19, 0.08, 0.19), 0, 1.00, 0, 0,0,0, LIB.oakLite);
  part(fg, new THREE.BoxGeometry(0.92, 0.06, 0.54), 0, 1.10, 0, -0.34, 0, 0, LIB.oak); // slanted desk
  part(fg, new THREE.BoxGeometry(0.96, 0.05, 0.07), 0, 1.02, 0.235, -0.34, 0, 0, LIB.oakLite);
  /* the open ledger */
  for (const sx of [-1, 1]){
    part(fg, new THREE.BoxGeometry(0.40, 0.035, 0.44), sx * 0.21, 1.155, 0.012, -0.34, 0, sx * 0.03, LIB.back);
  }
  part(fg, new THREE.BoxGeometry(0.05, 0.05, 0.44), 0, 1.16, 0.012, -0.34, 0, 0, LIB.doorDim);
  const rules = [];
  for (let i = 0; i < 7; i++)
    for (const sx of [-1, 1])
      rules.push({w:0.30, h:0.006, d:0.012, x:sx * 0.21, y:1.176, z:0.012, rx:-0.34});
  const rb = mergedBoxes(rules, LIB.iron);
  fg.add(rb.fill); fg.add(rb.edge);
  const fb = part(fg, new THREE.BoxGeometry(0.86, 0.02, 0.50), 0, 1.175, 0.012, -0.34, 0, 0, LIB.back);
  fb.visible = false;                                  // an invisible, easy click target over the pages
  markGroupRead(fg, {title: 'the ledger', filters: true, depth});
  /* the turning solid, hanging in the air above the desk */
  const solid = new THREE.Group();
  solid.position.set(0, 1.95, 0);
  fg.add(solid);
  part(solid, new THREE.OctahedronGeometry(0.17, 0), 0, 0, 0, 0, 0, 0, LIB.brass);
  const halo = makeGlyph(GLYPHS[depth % GLYPHS.length], 0.30, '#d9b45e');
  halo.position.set(0, 0.34, 0);
  solid.add(halo);
  spinners.push({o: solid, s: 0.5, b: halo, y0: 1.95});

  littleCase(cz, {title: 'what is on these shelves', shelfList: true, depth});
  fallingBooks(cz, 11);
  fallingGlyphs(cz, 14);
  buildSeal(G);

  /* lock in world positions for everything this room just added */
  scene.updateMatrixWorld(true);
  for (let i = G.mark.rd; i < readables.length; i++)
    readables[i]._anchor.getWorldPosition(readables[i]._pos);
  return G;
}

function disposeFrom(depth){
  if (depth >= galleries.length || depth < 1) return;
  truncTo(galleries[depth].mark);
  galleries.length = depth;
}
/* shut a gallery: tear down everything past this room and seal its door again */
function closeGallery(depth){
  const G = galleries[depth];
  if (!G || !G.next) return;
  disposeFrom(depth + 1);
  G.next = null;
  buildSeal(G);
  scene.updateMatrixWorld(true);
  const e = G.seal.entry;
  if (!e._pos){ e._pos = new THREE.Vector3(); }
  e._anchor.getWorldPosition(e._pos);
  showToast('the north door is sealed again');
  renderReading(reading);              // the lectern list redraws with the door shut
}
function openFilter(depth, opt){
  const G = galleries[depth];
  if (!G || !opt) return;
  const kept = G.works.filter(w => (w[opt.key] || []).indexOf(opt.value) > -1);
  if (!kept.length) return;                     // never happens: options come from matches
  disposeFrom(depth + 1);
  removeSeal(G);
  G.next = opt;
  buildGallery(depth + 1, kept, G.chain.concat([{key:opt.key, label:opt.label, value:opt.value}]));
  closeReading();
  showToast('the north door opened — ' + opt.label + ': ' + opt.value +
            ' (' + kept.length + (kept.length === 1 ? ' piece)' : ' pieces)'));
}

/* ---- an oak doorframe with the door standing open, swung back against the wall.
       `swing` is which side it hinges on, `face` which way the leaf opens. ---- */
function openDoorway(z, swing){
  const HW = DOOR_W/2, HH = DOOR_H;
  /* Every face here is deliberately offset from the wall it sits in. The jambs
     used to share the x plane of the doorway cut and the lintel's underside sat
     exactly on the header's underside — two coplanar surfaces, which is what was
     shimmering. Nothing below is flush with anything. */
  for (const sx of [-1, 1])                                   // jambs
    box(0.16, HH + 0.22, 0.31, sx * (HW + 0.05), (HH + 0.22)/2, z, {mat: LIB.oak});
  box(DOOR_W + 0.26, 0.18, 0.31, 0, HH + 0.05, z, {mat: LIB.oak});          // lintel, dropped 0.04
  box(DOOR_W + 0.42, 0.10, 0.39, 0, HH + 0.22, z, {mat: LIB.oakLite});      // dripstone
  /* the leaf, hinged open about 70° so you walk straight past it */
  const leaf = new THREE.Group();
  leaf.position.set(swing * HW, 0, z);
  leaf.rotation.y = swing * 1.05;
  scene.add(leaf);
  part(leaf, new THREE.BoxGeometry(DOOR_W - 0.06, HH - 0.06, 0.07),
       swing * (DOOR_W - 0.06)/2, (HH - 0.06)/2, 0, 0,0,0, LIB.door);
  for (const py of [0.62, 1.55])                                            // sunken panels
    part(leaf, new THREE.BoxGeometry(DOOR_W - 0.42, 0.72, 0.03),
         swing * (DOOR_W - 0.06)/2, py, 0.042, 0,0,0, LIB.doorDim);
  for (const by of [0.35, 1.85]){                                           // iron straps
    part(leaf, new THREE.BoxGeometry(DOOR_W - 0.10, 0.09, 0.035),
         swing * (DOOR_W - 0.06)/2, by, 0.05, 0,0,0, LIB.iron);
  }
  part(leaf, new THREE.TorusGeometry(0.09, 0.018, 5, 12),
       swing * (DOOR_W - 0.30), 1.10, 0.07, 0,0,0, LIB.brass);
  return leaf;
}

/* ================================================================

const onionTex = makeTex((x, S) => {
  x.fillStyle = '#9d6d95'; x.fillRect(0, 0, S, S);

const onionMat = new THREE.MeshPhongMaterial({map: onionTex, shininess: 30, specular: 0x4a4a4a});
const shootMat = new THREE.MeshPhongMaterial({color: 0x6f8f4a, shininess: 14, specular: 0x2a2a2a});

/* the silhouette of an onion, spun into a surface of revolution */
const ONION_GEO = (() => {
  const pts = [
    [0.000, 0.000], [0.075, 0.012], [0.155, 0.055], [0.235, 0.130], [0.283, 0.225],
    [0.292, 0.330], [0.262, 0.425], [0.196, 0.505], [0.116, 0.565], [0.055, 0.615],
    [0.028, 0.675], [0.012, 0.735], [0.000, 0.760]
  ].map(p => new THREE.Vector2(p[0], p[1]));
  return new THREE.LatheGeometry(pts, 22);
})();
const SHOOT_GEO = new THREE.CylinderGeometry(0.006, 0.030, 0.46, 6, 1, false);

/* merge many transformed copies into one buffer: keeps a heap to two draw calls */
function mergeGeos(items){
  let vc = 0, ic = 0;
  for (const it of items){ vc += it.geo.attributes.position.count; ic += it.geo.index.count; }
  const pos = new Float32Array(vc * 3), nor = new Float32Array(vc * 3), uv = new Float32Array(vc * 2);
  const idx = new Uint32Array(ic);
  const v = new THREE.Vector3(), nm = new THREE.Matrix3();
  let vo = 0, io = 0;
  for (const it of items){
    const g = it.geo, p = g.attributes.position, n = g.attributes.normal, t = g.attributes.uv;
    nm.getNormalMatrix(it.m);
    for (let i = 0; i < p.count; i++){
      v.fromBufferAttribute(p, i).applyMatrix4(it.m);
      pos[(vo+i)*3] = v.x; pos[(vo+i)*3+1] = v.y; pos[(vo+i)*3+2] = v.z;
      v.fromBufferAttribute(n, i).applyMatrix3(nm).normalize();
      nor[(vo+i)*3] = v.x; nor[(vo+i)*3+1] = v.y; nor[(vo+i)*3+2] = v.z;
      if (t){ uv[(vo+i)*2] = t.getX(i); uv[(vo+i)*2+1] = t.getY(i); }
    }
    for (let i = 0; i < g.index.count; i++) idx[io + i] = g.index.getX(i) + vo;
    vo += p.count; io += g.index.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal',   new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv',       new THREE.BufferAttribute(uv, 2));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  return out;
}

const _om = new THREE.Matrix4(), _oq = new THREE.Quaternion(), _oe = new THREE.Euler(), _ov = new THREE.Vector3();
function onionMatrices(x, y, z, s, bulbs, shoots){
  _oe.set((rnd() - 0.5) * 0.45, rnd() * 6.28, (rnd() - 0.5) * 0.45);
  _oq.setFromEuler(_oe);
  _om.compose(new THREE.Vector3(x, y, z), _oq, _ov.set(s, s, s));
  bulbs.push({geo: ONION_GEO, m: _om.clone()});
  const n = 1 + ((rnd() * 3) | 0);
  for (let i = 0; i < n; i++){
    const a = rnd() * 6.28, lean = 0.18 + rnd() * 0.5;
    const e = new THREE.Euler(Math.cos(a) * lean, rnd() * 6.28, Math.sin(a) * lean);
    const m = new THREE.Matrix4().compose(
      new THREE.Vector3(x, y + 0.74 * s, z),
      new THREE.Quaternion().setFromEuler(e),
      new THREE.Vector3(s, s * (0.7 + rnd() * 0.7), s));
    shoots.push({geo: SHOOT_GEO, m});
  }
}
/* one onion on its own (the readable ones in the onion room) */
function onion(x, y, z, s){
  const bulbs = [], shoots = [];
  onionMatrices(0, 0, 0, s || 1, bulbs, shoots);
  const g = new THREE.Group();
  g.position.set(x, y || 0, z);
  g.add(new THREE.Mesh(mergeGeos(bulbs), onionMat));
  g.add(new THREE.Mesh(mergeGeos(shoots), shootMat));
  scene.add(g);
  return g;
}
/* a heap of them, merged down to two draw calls */
function onionPile(cx, cz, n, spread){
  const bulbs = [], shoots = [];
  for (let i = 0; i < n; i++){
    const a = rnd() * 6.28, r = Math.sqrt(rnd()) * spread, d = r / spread;
    const lift = Math.min(0.55, (1 - d) * (1 - d) * spread * 0.28) * rnd();
    onionMatrices(cx + Math.cos(a) * r, lift, cz + Math.sin(a) * r,
                  0.46 + rnd() * 0.22, bulbs, shoots);
  }
  scene.add(new THREE.Mesh(mergeGeos(bulbs), onionMat));
  scene.add(new THREE.Mesh(mergeGeos(shoots), shootMat));
}

/* a framed picture on a wall: white mat, ink frame, image fitted inside */
const texLoader = new THREE.TextureLoader();
function framedPicture(entry, x, y, z, face, W, H){
  const g = new THREE.Group();
  g.position.set(x, y, z);
  if (face === '+x') g.rotation.y =  Math.PI/2;
  if (face === '-x') g.rotation.y = -Math.PI/2;
  if (face === '-z') g.rotation.y =  Math.PI;
  scene.add(g);
  const backing = part(g, new THREE.BoxGeometry(W, H, 0.07), 0, 0, 0, 0, 0, 0, meshMat);
  const iw = W - 0.20, ih = H - 0.20;
  const pic = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
                             new THREE.MeshBasicMaterial({color: 0xffffff}));
  pic.position.set(0, 0, 0.042);
  pic.scale.set(iw, ih, 1);
  g.add(pic);
  /* no photo? then it reads as a framed certificate: ruled lines, ink on white */
  let scribbled = null;
  function scribble(){
    if (scribbled) return;
    const l = [], n = 5, top = ih/2 - 0.16;
    for (let i = 0; i < n; i++){
      const y = top - i * (ih - 0.32) / (n - 1);
      const half = (i === 0 ? 0.30 : 0.40) * iw * (i === n - 1 ? 0.6 : 1);
      l.push([-half, y, 0.05], [half, y, 0.05]);
    }
    scribbled = linesFlat(l);
    g.add(scribbled);
  }
  if (entry.image){
    texLoader.load(entry.image, tex => {
      tex.anisotropy = 4;
      const im = tex.image;
      const a = (im && im.width && im.height) ? im.width / im.height : 1;
      let w = iw, h = iw / a;
      if (h > ih){ h = ih; w = ih * a; }
      pic.scale.set(w, h, 1);
      pic.material.map = tex; pic.material.needsUpdate = true;
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, h)), lineMat);
      e.position.copy(pic.position); g.add(e);
    }, undefined, scribble);        // missing file / file:// — fall back to the ruled certificate
  } else scribble();
  const lbl = makeLabel(entry.title, W * 0.92, 74);
  lbl.position.set(0, -H/2 - 0.17, 0.04);
  g.add(lbl);
  markRead([backing, pic], entry);
  return g;
}

/* ---- the workshop: three desks, three screens. Each screen paints the same
       card the portfolio site shows for that project. ---- */
function cardTex(kind){
  return makeTex((x, S) => {
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, S, S);
    const H = S * 0.62;                                   // the card's art panel
    if (kind === 'math'){
      x.fillStyle = '#2f2b8c'; x.fillRect(0, 0, S, H);
      x.fillStyle = '#e3b93f';
      x.beginPath(); x.arc(S*0.28, H*0.52, S*0.10, 0, 6.284); x.fill();
      x.fillStyle = '#c0392b';
      for (const d of [[0,-1],[0,1],[-1,0],[1,0]]){
        x.beginPath();
        x.moveTo(S*0.28 + d[0]*S*0.055, H*0.52 + d[1]*S*0.055);
        x.lineTo(S*0.28 + d[1]*S*0.028, H*0.52 - d[0]*S*0.028);
        x.lineTo(S*0.28 - d[0]*S*0.015, H*0.52 - d[1]*S*0.015);
        x.lineTo(S*0.28 - d[1]*S*0.028, H*0.52 + d[0]*S*0.028);
        x.closePath(); x.fill();
      }
      x.fillStyle = '#ffffff'; x.fillRect(S*0.42, H*0.36, S*0.16, S*0.16);
      x.strokeStyle = '#e3b93f'; x.lineWidth = 3; x.strokeRect(S*0.42, H*0.36, S*0.16, S*0.16);
      x.fillStyle = '#c0392b';
      x.beginPath(); x.moveTo(S*0.50, H*0.40); x.lineTo(S*0.535, H*0.44); x.lineTo(S*0.50, H*0.48); x.lineTo(S*0.465, H*0.44); x.closePath(); x.fill();
      x.fillStyle = '#2f6f3f';
      x.beginPath(); x.moveTo(S*0.475, H*0.50); x.lineTo(S*0.505, H*0.535); x.lineTo(S*0.475, H*0.57); x.lineTo(S*0.445, H*0.535); x.closePath(); x.fill();
      x.fillStyle = '#e3b93f'; x.fillRect(S*0.62, H*0.36, S*0.17, S*0.16);
      x.fillStyle = '#ffffff'; x.font = '700 ' + (S*0.055|0) + 'px Helvetica,Arial,sans-serif';
      x.textAlign = 'center'; x.fillText('2048', S*0.705, H*0.47);
    } else if (kind === 'pitch'){
      x.fillStyle = '#111111'; x.fillRect(0, 0, S, H);
      const kw = S / 7, ky = H * 0.30, kh = H * 0.60;
      for (let i = 0; i < 7; i++){
        x.fillStyle = (i === 3) ? '#2f6fbf' : '#f2efe9';
        x.fillRect(i * kw + 2, ky, kw - 4, kh);
      }
      x.fillStyle = '#111111';
      for (const i of [0, 1, 3, 4, 5])
        x.fillRect((i + 1) * kw - kw * 0.22, ky, kw * 0.44, kh * 0.62);
      x.fillStyle = '#f2efe9'; x.font = '700 ' + (S*0.10|0) + 'px Helvetica,Arial,sans-serif';
      x.textAlign = 'center'; x.fillText('♪', S*0.46, ky - H*0.06);
      x.fillStyle = '#2f6fbf'; x.fillText('))', S*0.58, ky - H*0.06);
    } else {
      const n = 8, c = S / n, ch = H / 5;
      for (let r = 0; r < 5; r++) for (let i = 0; i < n; i++){
        x.fillStyle = ((r + i) % 2) ? '#8a7448' : '#e7ddc4';
        x.fillRect(i * c, r * ch, c, ch);
      }
      x.fillStyle = '#141414'; x.font = '700 ' + (S*0.20|0) + 'px Georgia,serif';
      x.textAlign = 'center'; x.fillText('♞', S*0.52, H*0.72);
    }
    x.fillStyle = '#ffffff'; x.fillRect(0, H, S, S - H);
    x.fillStyle = '#141414'; x.textAlign = 'left';
    x.font = '600 ' + (S*0.062|0) + 'px Helvetica,Arial,sans-serif';
    x.fillText({math:'Classic Math Games', pitch:'Pitch Trainer', chess:'Chess Line Visualizer'}[kind],
               S*0.06, H + (S - H) * 0.40);
    x.fillStyle = '#1a56db';
    x.font = '600 ' + (S*0.052|0) + 'px Helvetica,Arial,sans-serif';
    x.fillText('View project →', S*0.06, H + (S - H) * 0.76);
  }, 1);
}
