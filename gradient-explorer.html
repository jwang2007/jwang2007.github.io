<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient explorer — f(x, y) = 1.5 sin x cos y</title>
<style>
  :root{
    --bg:#faf9f5; --panel:#ffffff; --ink:#1f1e1d; --ink-2:#52514e; --ink-3:#898781;
    --grid:#e1e0d9; --accent:#eb6834;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1a1a19; --panel:#222221; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#898781;
           --grid:#2c2c2a; --accent:#d95926; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
        display:flex; justify-content:center; padding:36px 16px; }
  main{ width:100%; max-width:760px; }
  .head{ display:flex; justify-content:space-between; align-items:baseline; margin:0 2px 8px; }
  .fn{ font-size:15px; color:var(--ink-2); font-family:var(--mono); }
  .hint{ font-size:12px; color:var(--ink-3); }
  canvas{ width:100%; display:block; touch-action:none; cursor:grab;
          background:var(--panel); border:1px solid var(--grid); border-radius:14px; }
  canvas:active{ cursor:grabbing; }
  .read{ font-size:14px; margin:12px 2px 0; font-family:var(--mono); min-height:1.4em; }
  .leg{ font-size:12px; color:var(--ink-2); margin:8px 2px 0; display:flex; flex-wrap:wrap; gap:4px 16px; }
  .leg span{ display:inline-flex; align-items:center; gap:6px; }
  .leg i{ width:14px; height:3px; border-radius:2px; display:inline-block; }
  .sliders{ display:flex; gap:20px; margin-top:14px; }
  .sliders label{ flex:1; font-size:13px; color:var(--ink-2); }
  .sliders b{ font-family:var(--mono); font-weight:500; color:var(--ink); }
  input[type=range]{ width:100%; accent-color:var(--accent); margin-top:6px; }
</style>
</head>
<body>
<main>
  <div class="head">
    <span class="fn">f(x, y) = 1.5 sin x cos y</span>
    <span class="hint">drag to rotate</span>
  </div>
  <canvas id="c" role="img" aria-label="Rotatable 3D surface with its gradient vector field on the plane below">
    Surface plot of 1.5 sin x cos y with gradient field.
  </canvas>
  <div class="read" id="read"></div>
  <div class="leg" id="leg"></div>
  <div class="sliders">
    <label>x&#8320; = <b id="xv">1.10</b><input id="xs" type="range" min="-3" max="3" step="0.05" value="1.1"></label>
    <label>y&#8320; = <b id="yv">0.50</b><input id="ys" type="range" min="-3" max="3" step="0.05" value="0.5"></label>
  </div>
</main>
<script>
(function(){
"use strict";
var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
var readEl=document.getElementById('read'), legEl=document.getElementById('leg');
var sxEl=document.getElementById('xs'), syEl=document.getElementById('ys');
var sxv=document.getElementById('xv'), syv=document.getElementById('yv');

// --- theme ---------------------------------------------------------------
var mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
var dark=mq?mq.matches:false;
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function parseCol(c){
  c=(c||'').trim();
  if(c[0]==='#'){ var h=c.slice(1); if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n=parseInt(h.slice(0,6),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
  var m=c.match(/(\d+\.?\d*)[ ,]+(\d+\.?\d*)[ ,]+(\d+\.?\d*)/);
  return m?[+m[1],+m[2],+m[3]]:null;
}
function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
var lowC, highC, gradHex, gradC, upHex, inkMut, gridC;
function setColors(){
  lowC = dark?[12,68,124]:[181,212,244];      // surface ramp: blue 800 -> 200 (dark), 100 -> 600 (light)
  highC= dark?[133,183,235]:[24,95,165];
  gradHex = dark?'#d95926':'#eb6834';         // gradient arrows
  gradC = parseCol(gradHex);
  upHex = dark?'#1baf7a':'#0f8f66';           // uphill direction on the surface
  inkMut = parseCol(css('--ink-3'))||[137,135,129];
  gridC  = parseCol(css('--grid'))||(dark?[44,44,42]:[225,224,217]);
}

// --- the function and its gradient ---------------------------------------
var L=3.2, N=48, A=1.5, ZB=-2.5;              // domain half-width, grid, amplitude, floor height
function F (x,y){ return  A*Math.sin(x)*Math.cos(y); }
function FX(x,y){ return  A*Math.cos(x)*Math.cos(y); }
function FY(x,y){ return -A*Math.sin(x)*Math.sin(y); }

var xs=[], H=[], i, j;
for(i=0;i<=N;i++) xs.push(-L+2*L*i/N);
for(i=0;i<=N;i++){ H.push([]); for(j=0;j<=N;j++) H[i].push(F(xs[i],xs[j])); }

// --- marching squares for level curves (cached in world coords) ----------
function marching(level){
  var segs=[];
  for(var a=0;a<N;a++)for(var b=0;b<N;b++){
    var v0=H[a][b]-level, v1=H[a+1][b]-level, v2=H[a+1][b+1]-level, v3=H[a][b+1]-level;
    var idx=(v0>0?1:0)|(v1>0?2:0)|(v2>0?4:0)|(v3>0?8:0);
    if(idx===0||idx===15) continue;
    var x0=xs[a], x1=xs[a+1], y0=xs[b], y1=xs[b+1];
    function it(p,q){ return p/(p-q); }
    var E=[null,null,null,null];
    if((idx&1)!==((idx>>1)&1))      E[0]=[x0+(x1-x0)*it(v0,v1), y0];
    if(((idx>>1)&1)!==((idx>>2)&1)) E[1]=[x1, y0+(y1-y0)*it(v1,v2)];
    if(((idx>>3)&1)!==((idx>>2)&1)) E[2]=[x0+(x1-x0)*it(v3,v2), y1];
    if((idx&1)!==((idx>>3)&1))      E[3]=[x0, y0+(y1-y0)*it(v0,v3)];
    var pts=E.filter(Boolean);
    if(pts.length===2) segs.push([pts[0],pts[1]]);
    else if(pts.length===4){ segs.push([E[0],E[1]]); segs.push([E[2],E[3]]); }
  }
  return segs;
}
var CONT=[-1.2,-0.75,-0.3,0.3,0.75,1.2].map(marching);

// --- projection: yaw th about z, pitch ph, orthographic ------------------
var th=-0.7, ph=0.5, px=1.1, py=0.5;
var W=0, Hc=0, S=1, CX=0, CY=0, dpr=1;
function proj(x,y,z){
  var c=Math.cos(th), s=Math.sin(th);
  var x1=x*c-y*s, y1=x*s+y*c;
  var cp=Math.cos(ph), sp=Math.sin(ph);
  return [CX+S*x1, CY-S*(y1*sp+z*cp), y1*cp-z*sp];   // [screen x, screen y, depth]
}
function arrow(p,q,w,col,hs){
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke();
  var dx=q[0]-p[0], dy=q[1]-p[1], d=Math.hypot(dx,dy);
  if(d<1) return;
  dx/=d; dy/=d;
  ctx.beginPath();
  ctx.moveTo(q[0]+hs*dx*0.4, q[1]+hs*dy*0.4);
  ctx.lineTo(q[0]-hs*dx+hs*0.5*dy, q[1]-hs*dy-hs*0.5*dx);
  ctx.lineTo(q[0]-hs*dx-hs*0.5*dy, q[1]-hs*dy+hs*0.5*dx);
  ctx.closePath(); ctx.fill();
}

// --- render ---------------------------------------------------------------
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,Hc);
  var ext=L*Math.SQRT2;
  var up=ext*Math.sin(ph)+A*Math.cos(ph), dn=ext*Math.sin(ph)-ZB*Math.cos(ph);
  S=Math.min((W-28)/(2*ext), (Hc-28)/(up+dn));
  CX=W/2; CY=14+S*up;

  // floor outline
  var c00=proj(-L,-L,ZB), c10=proj(L,-L,ZB), c11=proj(L,L,ZB), c01=proj(-L,L,ZB);
  ctx.strokeStyle=rgba(gridC,1); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(c00[0],c00[1]); ctx.lineTo(c10[0],c10[1]);
  ctx.lineTo(c11[0],c11[1]); ctx.lineTo(c01[0],c01[1]); ctx.closePath(); ctx.stroke();

  // level curves on the floor
  ctx.strokeStyle=rgba(inkMut,0.5); ctx.lineWidth=1;
  ctx.beginPath();
  for(var lv=0; lv<CONT.length; lv++){
    var sl=CONT[lv];
    for(var k=0;k<sl.length;k++){
      var sa=proj(sl[k][0][0], sl[k][0][1], ZB), sb=proj(sl[k][1][0], sl[k][1][1], ZB);
      ctx.moveTo(sa[0],sa[1]); ctx.lineTo(sb[0],sb[1]);
    }
  }
  ctx.stroke();

  // gradient vector field on the floor
  for(var gx=-2.8; gx<2.85; gx+=0.8) for(var gy=-2.8; gy<2.85; gy+=0.8){
    var vx=FX(gx,gy), vy=FY(gx,gy), m=Math.hypot(vx,vy);
    if(m<0.07) continue;
    if(m>1.9){ vx*=1.9/m; vy*=1.9/m; }
    arrow(proj(gx,gy,ZB), proj(gx+0.26*vx, gy+0.26*vy, ZB), 1.2, rgba(gradC,0.55), 5);
  }

  // axis labels
  ctx.fillStyle=rgba(inkMut,0.9); ctx.font='12px '+css('--sans');
  var ax=proj(L*1.14,0,ZB); ctx.fillText('x', ax[0]-3, ax[1]+4);
  var ay=proj(0,L*1.14,ZB); ctx.fillText('y', ay[0]-3, ay[1]+4);

  // surface quads, painter's algorithm
  var quads=[];
  for(i=0;i<N;i++) for(j=0;j<N;j++){
    var p0=proj(xs[i],xs[j],H[i][j]),       p1=proj(xs[i+1],xs[j],H[i+1][j]),
        p2=proj(xs[i+1],xs[j+1],H[i+1][j+1]), p3=proj(xs[i],xs[j+1],H[i][j+1]);
    quads.push([(p0[2]+p1[2]+p2[2]+p3[2])/4, p0,p1,p2,p3,
      (H[i][j]+H[i+1][j]+H[i+1][j+1]+H[i][j+1])/4, (xs[i]+xs[i+1])/2, (xs[j]+xs[j+1])/2]);
  }
  quads.sort(function(a,b){ return b[0]-a[0]; });
  for(var q=0;q<quads.length;q++){
    var Q=quads[q], t=(Q[5]/A+1)/2;
    var nx=-FX(Q[6],Q[7]), ny=-FY(Q[6],Q[7]), nm=Math.hypot(nx,ny,1);
    var lt=0.8+0.3*Math.max(0,(nx*0.45-ny*0.3+0.85)/nm/1.05);   // cheap Lambert shading
    var r =Math.min(255,Math.round((lowC[0]+(highC[0]-lowC[0])*t)*lt));
    var g =Math.min(255,Math.round((lowC[1]+(highC[1]-lowC[1])*t)*lt));
    var b2=Math.min(255,Math.round((lowC[2]+(highC[2]-lowC[2])*t)*lt));
    ctx.fillStyle='rgb('+r+','+g+','+b2+')';
    ctx.strokeStyle=dark?'rgba(0,0,0,0.35)':'rgba(255,255,255,0.35)';
    ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(Q[1][0],Q[1][1]); ctx.lineTo(Q[2][0],Q[2][1]);
    ctx.lineTo(Q[3][0],Q[3][1]); ctx.lineTo(Q[4][0],Q[4][1]); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  // selected point: floor marker, nabla f arrow, riser, surface dot, uphill arrow
  var ga=FX(px,py), gb=FY(px,py), gm=Math.hypot(ga,gb);
  var pb=proj(px,py,ZB), zs=F(px,py), ps=proj(px,py,zs);
  ctx.setLineDash([4,4]); ctx.strokeStyle=rgba(inkMut,0.8); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pb[0],pb[1]); ctx.lineTo(ps[0],ps[1]); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=gradHex;
  ctx.beginPath(); ctx.arc(pb[0],pb[1],3.5,0,6.2832); ctx.fill();
  if(gm>0.001){
    var sc=0.55; if(sc*gm>1.7) sc=1.7/gm;
    var tb=proj(px+sc*ga, py+sc*gb, ZB);
    arrow(pb, tb, 2.5, gradHex, 8);
    ctx.font='500 13px '+css('--sans'); ctx.fillStyle=gradHex;
    ctx.fillText('∇f', tb[0]+7, tb[1]+4);
    var ux=ga/gm, uy=gb/gm, ex=px+0.55*ux, ey=py+0.55*uy;
    if(Math.abs(ex)<=L && Math.abs(ey)<=L) arrow(ps, proj(ex,ey,F(ex,ey)), 2.5, upHex, 8);
  }
  ctx.fillStyle=upHex;
  ctx.strokeStyle=dark?'#222221':'#ffffff'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(ps[0],ps[1],4.5,0,6.2832); ctx.fill(); ctx.stroke();
}

// --- readout, legend ------------------------------------------------------
function fmt(v){ var s=v.toFixed(2); return s==='-0.00'?'0.00':s; }
function updateRead(){
  var a=FX(px,py), b=FY(px,py), m=Math.hypot(a,b);
  readEl.innerHTML='∇f('+fmt(px)+', '+fmt(py)+') = <span style="color:'+gradHex+'">('+fmt(a)+', '+fmt(b)+')</span> &nbsp; |∇f| = '+fmt(m)
    +(m<0.05?' <span style="color:var(--ink-3); font-family:var(--sans);">≈ critical point</span>':'');
  sxv.textContent=fmt(px); syv.textContent=fmt(py);
}
function chrome(){
  legEl.innerHTML=
    '<span><i style="background:'+gradHex+'"></i>∇f in the xy-plane</span>'+
    '<span><i style="background:'+upHex+'"></i>uphill on the surface</span>'+
    '<span><i style="background:'+rgba(inkMut,0.7)+'"></i>level curves</span>';
  updateRead();
}

// --- sizing, interaction, spin -------------------------------------------
var lastW=0;
function resize(){
  var w=canvas.clientWidth||340;
  if(w===lastW){ render(); return; }
  lastW=w;
  var h=Math.max(260, Math.min(Math.round(w*0.72), 560));
  canvas.style.height=h+'px';
  dpr=window.devicePixelRatio||1;
  W=w; Hc=h;
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
  render();
}
var spin=true;
function loop(){ if(!spin) return; th+=0.0035; render(); requestAnimationFrame(loop); }
var dragP=null;
canvas.addEventListener('pointerdown', function(e){
  spin=false; dragP=[e.clientX,e.clientY]; canvas.setPointerCapture(e.pointerId); e.preventDefault();
});
canvas.addEventListener('pointermove', function(e){
  if(!dragP) return;
  th+=(e.clientX-dragP[0])*0.008;
  ph=Math.max(0.15, Math.min(1.15, ph+(e.clientY-dragP[1])*0.006));
  dragP=[e.clientX,e.clientY]; render();
});
window.addEventListener('pointerup', function(){ dragP=null; });
function onSlide(){ spin=false; px=+sxEl.value; py=+syEl.value; updateRead(); render(); }
sxEl.addEventListener('input', onSlide);
syEl.addEventListener('input', onSlide);
window.addEventListener('resize', resize);
if(window.ResizeObserver) new ResizeObserver(function(){ resize(); }).observe(canvas);
if(mq&&mq.addEventListener) mq.addEventListener('change', function(e){ dark=e.matches; setColors(); chrome(); render(); });

setColors(); chrome(); resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
